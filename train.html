<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>平面図形 トレーニング</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAF1F6; --grid:#CFDDE8; --grid5:#A9C0D2; --ink:#1D2B3A; --sub:#4E6274;
  --card:#FFFFFF; --line:#1D2B3A;
  --grass:#4F9A3E; --grass2:#7CC264; --dirt:#8A5A33; --dirt2:#A97446;
  --stone:#7F8B96; --stone2:#A3AEB8;
  --gold:#F2B705; --gold2:#FFE07A;
  --rasp:#B84A62; --rasp2:#E07A92;
  --good:#2F7D5B; --goodbg:#DDF1E7; --hintbg:#FFF4CF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#132131; --grid:#1F3346; --grid5:#2E4A63; --ink:#E7EEF5; --sub:#A7B7C6;
    --card:#1A2B3E; --line:#0A121C;
    --good:#7FD3A8; --goodbg:#16362A; --hintbg:#3A3215;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#132131; --grid:#1F3346; --grid5:#2E4A63; --ink:#E7EEF5; --sub:#A7B7C6;
  --card:#1A2B3E; --line:#0A121C;
  --good:#7FD3A8; --goodbg:#16362A; --hintbg:#3A3215;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:17px; line-height:1.7;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
}
.wrap{ max-width:680px; margin:0 auto; padding:16px 14px 64px; }
h1,h2,.pix{ font-family:"DotGothic16","Zen Kaku Gothic New",monospace; font-weight:400; }
h1{ font-size:26px; line-height:1.3; margin:8px 0 4px; }
.lead{ margin:0 0 14px; color:var(--sub); font-size:15px; }
nav.steps{ display:flex; gap:6px; overflow-x:auto; padding:4px 0 10px; }
nav.steps button{
  flex:0 0 auto; font:inherit; font-size:14px; padding:6px 10px;
  border:2px solid var(--line); border-bottom-width:4px; background:var(--card); color:var(--ink);
  border-radius:4px; cursor:pointer; white-space:nowrap;
}
nav.steps button[aria-current="step"]{ background:var(--gold); color:#1D2B3A; }
nav.steps button:disabled{ opacity:.4; cursor:default; }
section.stage{ background:var(--card); border:2px solid var(--line); border-radius:6px; padding:16px 14px 18px; }
h2{ font-size:22px; margin:0 0 6px; line-height:1.35; }
p{ margin:6px 0 10px; }
.row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.btn{
  font:inherit; font-weight:700; font-size:16px; padding:8px 14px; min-height:44px;
  border:2px solid var(--line); border-bottom-width:5px; border-radius:6px;
  background:var(--card); color:var(--ink); cursor:pointer;
}
.btn:active{ transform:translateY(2px); border-bottom-width:3px; }
.btn.main{ background:var(--grass); color:#fff; }
.btn.gold{ background:var(--gold); color:#1D2B3A; }
.btn:disabled{ opacity:.45; cursor:default; transform:none; border-bottom-width:5px; }
.btn.sq{ width:48px; padding:0; font-size:24px; }
button:focus-visible, input:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
.big{ font-family:"DotGothic16",monospace; font-size:30px; min-width:2.2em; text-align:center; }
input[type=range]{ width:100%; accent-color:var(--grass); }
svg{ display:block; width:100%; height:auto; }
.board{ margin:10px 0; border:2px solid var(--line); border-radius:4px; background:var(--paper); }
.msg{ padding:10px 12px; border-radius:6px; border:2px solid var(--line); margin:10px 0; }
.msg.ok{ background:var(--goodbg); }
.msg.hint{ background:var(--hintbg); }
.msg.warn{ background:var(--hintbg); }
table{ border-collapse:collapse; width:100%; margin:8px 0; font-variant-numeric:tabular-nums; }
.tscroll{ overflow-x:auto; }
th,td{ border:2px solid var(--line); padding:4px 6px; text-align:center; min-width:34px; }
th{ background:var(--paper); font-weight:700; white-space:nowrap; }
td.dim{ opacity:.35; }
td.hl, th.hl{ background:var(--gold2); color:#1D2B3A; }
td.prod{ font-weight:900; color:var(--good); }
.q{ margin:14px 0 4px; padding-top:12px; border-top:2px dashed var(--grid5); }
.q h3{ margin:0 0 8px; font-size:18px; }
.opts{ display:flex; flex-wrap:wrap; gap:8px; }
.opts .btn{ font-weight:400; }
.opts .btn.right{ background:var(--goodbg); border-color:var(--good); }
.opts .btn.right:disabled{ opacity:1; font-weight:700; }
.opts .btn.wrong{ opacity:.5; text-decoration:line-through; }
.acard{ display:flex; gap:14px; align-items:center; padding:12px; border:3px solid var(--line); border-radius:6px; background:var(--gold2); color:#1D2B3A; margin:10px 0; }
.acard .a{ font-family:"DotGothic16",monospace; font-size:40px; line-height:1; white-space:nowrap; }
.acard b{ font-size:18px; }
.cmp{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
.cmp > div{ border:2px solid var(--line); border-radius:6px; padding:10px; }
.cmp h3{ margin:0 0 4px; font-size:18px; }
.cmp .f{ font-family:"DotGothic16",monospace; font-size:22px; }
.ex{ border:2px solid var(--line); border-radius:6px; padding:10px 12px; margin:8px 0; }
.ex.bad{ border-style:dashed; }
.ex .tag{ font-weight:900; }
.ex.good .tag{ color:var(--good); }
.ex.bad .tag{ color:var(--rasp); }
.note{ font-family:"DotGothic16",monospace; font-size:19px; line-height:1.9; }
.frac{ display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; line-height:1.05; margin:0 2px; }
.frac span:first-child{ border-bottom:2px solid currentColor; padding:0 3px; }
.eq{ font-family:"DotGothic16",monospace; font-size:24px; }
input.num{ font:inherit; font-size:22px; width:7em; padding:6px 8px; border:2px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink); }
.prog{ font-size:14px; color:var(--sub); }
.foot{ margin-top:16px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.sit{ font-size:17px; padding:10px 12px; border-left:6px solid var(--grass); background:var(--paper); margin:8px 0; }
@media (max-width:480px){ .cmp{ grid-template-columns:1fr; } h1{ font-size:22px; } }
@media (prefers-reduced-motion: no-preference){
  .pop{ animation:pop .35s ease-out; }
  @keyframes pop{ from{ transform:scale(.6); opacity:0; } to{ transform:scale(1); opacity:1; } }
}
.howto{ border:2px solid var(--line); border-radius:6px; padding:10px 12px; background:var(--paper); margin:8px 0 12px; }
.howto p{ margin:4px 0; }
.howto .ex{ background:var(--card); }
.step{ display:flex; gap:10px; align-items:flex-start; margin:12px 0 6px; }
.step .n{ flex:0 0 auto; width:30px; height:30px; border:2px solid var(--line); border-radius:50%; display:grid; place-items:center; font-family:"DotGothic16",monospace; background:var(--gold); color:#1D2B3A; }
.step .body{ flex:1; }
input.num.s{ width:4.2em; font-size:20px; padding:4px 6px; }
input.num.bad{ border-color:var(--rasp); background:var(--hintbg); }
.tog .btn[aria-pressed="true"]{ background:var(--gold); color:#1D2B3A; }
.once{ font-size:14px; color:var(--sub); margin:2px 0 6px; }
.opts .btn.picked-wrong{ background:var(--hintbg); border-color:var(--rasp); opacity:1; }
.opts .btn:disabled{ opacity:.55; }
.msg.miss{ background:var(--hintbg); }
.empty{ position:relative; }
.empty .over{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }
.empty .over span{ background:var(--card); border:2px solid var(--line); border-radius:6px; padding:6px 10px; font-weight:700; }
td input.num.s{ width:3.6em; font-size:17px; }

:root{ --comp:#2E6FB7; --red:#C8323C; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --comp:#7FB2EE; --red:#F07A80; } }
.cap{ margin:2px 0 12px; }
.btn.sm{ font-size:14px; min-height:38px; padding:4px 10px; }
.chiprow{ border:2px solid var(--line); border-radius:6px; padding:6px 8px; margin:6px 0; background:var(--card); }
.steps-list{ padding-left:1.5em; margin:8px 0; }
.steps-list li{ margin:3px 0; color:var(--sub); }
.steps-list li.done{ color:var(--ink); }
.steps-list li.now{ color:var(--ink); font-weight:700; background:var(--gold2); color:#1D2B3A; border-radius:4px; padding:0 4px; }
.board svg{ max-width:100%; }
.stepchip{ display:inline-grid; place-items:center; width:30px; height:30px; border:2px solid var(--line); border-radius:50%; font-family:"DotGothic16",monospace; background:var(--card); }
.stepchip.on{ background:var(--gold); color:#1D2B3A; }
.stepchip.done{ background:var(--goodbg); }
.dlist{ display:flex; flex-direction:column; gap:8px; margin:8px 0; touch-action:none; }
.dcard{ display:flex; gap:10px; align-items:center; padding:10px 12px; border:2px solid var(--line); border-bottom-width:4px; border-radius:6px; background:var(--card); cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; }
.dcard.drag{ background:var(--gold2); color:#1D2B3A; box-shadow:0 6px 14px rgba(0,0,0,.18); cursor:grabbing; position:relative; z-index:2; }
.dcard.good{ background:var(--goodbg); } .dcard.bad{ background:var(--hintbg); border-color:var(--rasp); }
.dcard .grip{ font-size:20px; color:var(--sub); } .dcard .dnum{ font-family:"DotGothic16",monospace; font-size:20px; min-width:1.2em; }
.cgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:6px; }
.ccell{ border:2px solid var(--line); border-radius:6px; padding:6px; background:var(--card); }
code{ font-family:"DotGothic16",monospace; background:var(--paper); padding:1px 6px; border-radius:4px; }
.symline{ min-height:56px; border:2px solid var(--line); border-radius:6px; background:var(--card); padding:8px 12px; margin:8px 0; font-family:"DotGothic16",monospace; font-size:26px; letter-spacing:.04em; }
.symline.good{ background:var(--goodbg); } .symline.bad{ background:var(--hintbg); border-color:var(--rasp); }
.btn.tok{ font-family:"DotGothic16",monospace; font-size:22px; min-width:56px; }
.btn.on{ background:var(--gold2); color:#1D2B3A; }
/* パソコン向け：広い画面では図を大きく */
@media (min-width:900px){ .wrap{ max-width:980px; } .board svg{ max-height:420px; } }
/* ステージの中で開くとき */
html.embed body{ background:var(--card); }
html.embed h1, html.embed .tolink, html.embed .lead, html.embed #nav, html.embed .wrap > .row{ display:none !important; }
html.embed .wrap{ max-width:none; padding:10px 18px; }
html.embed .board svg{ max-height:56vh; }
.cdboard{ background:var(--card); } .cdboard svg{ max-height:60vh; width:100%; user-select:none; -webkit-user-select:none; }
.cdtools .btn.on{ background:var(--gold2); }
details.hint{ margin:6px 0; } details.hint summary{ cursor:pointer; font-weight:700; }
</style>

</head>
<body>
<div class="wrap">
  <h1>平面図形 トレーニング</h1><p class="tolink" style="margin:0 0 6px"><a href="index.html">← ステージ攻略にもどる</a></p>
  <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><p class="lead">合言葉は「何が等しい？」。予想してから動かし、最後は自分で描く。</p><button type="button" id="snd" class="btn" style="flex:0 0 auto;font-size:14px;min-height:38px;padding:4px 10px"></button></div>
  <nav class="steps" id="nav" aria-label="まとまり"></nav>
  <main id="app"></main>
</div>
<script>
(function(){
"use strict";
var QS=new URLSearchParams(location.search), EMB=QS.get("embed"), EMB_TITLE=QS.get("title")||"";
var TRIAL=QS.get("trial")==="1"; try{ if(sessionStorage.getItem("heimen-trial")==="1") TRIAL=true; }catch(e){}
if(TRIAL) window.ML_TRIAL=true;
var KEY= EMB ? "heimen-zukei-embed" : (TRIAL ? "heimen-zukei-trial" : "heimen-zukei-v1");
if(TRIAL && !EMB){ try{ localStorage.removeItem("heimen-zukei-trial"); }catch(e){} }
if(EMB) document.documentElement.classList.add("embed");
/* ===== 記録をGoogleスプレッドシートへ送る（おうちの人が送り先を設定したときだけ） ===== */
var ML={cfg:"math-log-cfg",q:"math-log-queue",snap:"math-log-snap",weak:"math-log-weak"};
var ML_DEFAULT={url:"https://script.google.com/macros/s/AKfycbxFiVLtta4SReMGX4mZqS0o8NBUdXCtk4QLEb04SaAjFrRY4hphDe-MyTtrpdcwL0wq/exec",key:"nT9KazeaiK3fD4x0"};
function mlCfg(){ var c; try{ c=JSON.parse(localStorage.getItem(ML.cfg))||{}; }catch(e){ c={}; } if(!c.url){ c.url=ML_DEFAULT.url; c.key=ML_DEFAULT.key; } return c; }
function mlSetCfg(c){ try{ localStorage.setItem(ML.cfg,JSON.stringify(c)); }catch(e){} }
function mlQ(){ try{ return JSON.parse(localStorage.getItem(ML.q))||[]; }catch(e){ return []; } }
function mlStrip(h){ return String(h==null?"":h).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim(); }
function mlLog(row){ if(window.ML_TRIAL) return; row.t=new Date().toISOString(); row.app=row.app||"平面図形 ステージ攻略"; var q=mlQ(); q.push(row); if(q.length>800) q=q.slice(-800); try{ localStorage.setItem(ML.q,JSON.stringify(q)); }catch(e){} mlFlush(); }
var mlBusy=false;
function mlPost(c,body,cors){ return fetch(c.url,{method:"POST",mode:cors?"cors":"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}); }
function mlFlush(){ var c=mlCfg(); if(!c.url||!c.key||mlBusy) return; var q=mlQ(); if(!q.length) return; var batch=q.slice(0,40); mlBusy=true;
  mlPost(c,{key:c.key,rows:batch}).then(function(){ var q2=mlQ(); q2.splice(0,batch.length); try{ localStorage.setItem(ML.q,JSON.stringify(q2)); }catch(e){} mlBusy=false; c=mlCfg(); c.sent=(c.sent||0)+batch.length; c.last=new Date().toISOString(); mlSetCfg(c); if(q2.length) mlFlush(); }).catch(function(){ mlBusy=false; }); }
function mlSnapshot(force){ var c=mlCfg(); if(!c.url||!c.key) return Promise.resolve(-1); if(!force && localStorage.getItem(ML.snap)) return Promise.resolve(0);
  if(!c.dev){ c.dev=(/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)?"スマホ":"パソコン")+"-"+Math.random().toString(36).slice(2,6); mlSetCfg(c); }
  var skip=/^(math-log-|heimen-zukei-embed)/, items=[];
  for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(!k||skip.test(k)) continue; var v=localStorage.getItem(k)||""; var n=Math.max(1,Math.ceil(v.length/40000)); for(var p=0;p<n;p++) items.push({dev:c.dev,origin:location.origin,k:k,part:p+1,total:n,data:v.slice(p*40000,(p+1)*40000)}); }
  var chain=Promise.resolve();
  for(var j=0;j<items.length;j+=3){ (function(g){ chain=chain.then(function(){ return mlPost(c,{key:c.key,snapshot:g}); }); })(items.slice(j,j+3)); }
  return chain.then(function(){ try{ localStorage.setItem(ML.snap,new Date().toISOString()); }catch(e){} return items.length; });
}
function mlWeakCache(){ try{ return JSON.parse(localStorage.getItem(ML.weak))||null; }catch(e){ return null; } }
function mlWeakFetch(){ var c=mlCfg(); if(!c.url||!c.key) return Promise.resolve(null);
  return mlPost(c,{key:c.key,want:"weak"},true).then(function(r){ return r.json(); }).then(function(d){ if(d&&d.ok&&d.weak){ try{ localStorage.setItem(ML.weak,JSON.stringify({at:Date.now(),weak:d.weak})); }catch(e){} return d.weak; } return null; }).catch(function(){ return null; }); }

function mlPat(it){ var t=it.type,u=it.u;
  if(["cdraw","construct","order"].indexOf(t)>=0) return "作図の手順";
  if(t==="move"||t==="gdraw"||u==="u2") return "図形の移動";
  if(t==="sym"||u==="u1") return "言葉・記号の意味";
  if(u==="u3") return "作図の意味（等しい距離）";
  if(u==="u4") return "作図の手順";
  if(u==="u5") return "作図の文章題の読み取り";
  if(u==="u6") return t==="num"?"計算（π・おうぎ形）":"おうぎ形の考え方";
  if(u==="u7") return "ワークの直し";
  if(u==="u8") return "寄り道（活用）";
  return "その他"; }
function mlAns(it){ if(it.opts&&it.c!=null) return Array.isArray(it.c)?it.c.map(function(i){return mlStrip(it.opts[i]);}).join(" / "):mlStrip(it.opts[it.c]); if(it.ans!=null) return String(it.ans)+(it.unit?" "+it.unit:""); return ""; }
function mlGot(it,c){ try{ if(it.opts){ if(c.pick!=null&&it.opts[c.pick]!=null) return mlStrip(it.opts[c.pick]); if(c.sel&&c.sel.length) return c.sel.map(function(i){return mlStrip(it.opts[i]);}).join(" / "); } if(c.vals&&c.vals.length) return c.vals.join(" "); }catch(e){} return ""; }
/* ---------- 小道具 ---------- */
function shuffle(n){ var a=[]; for(var i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function m(n){ return n<0 ? "−"+Math.abs(n) : String(n); }
function parseNum(s){
  s=String(s==null?"":s).trim().replace(/[−ー―－‐]/g,"-").replace(/／/g,"/").replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);}).replace(/．/g,".").replace(/\s/g,"").replace(/π/g,"");
  if(!s) return null;
  if(s.indexOf("/")>=0){ var p=s.split("/"); if(p.length!==2) return null; var a=parseFloat(p[0]),b=parseFloat(p[1]); if(isNaN(a)||isNaN(b)||b===0) return null; return a/b; }
  var v=Number(s); return isNaN(v)?null:v;
}
function same(a,b){ return a!==null && Math.abs(a-b)<1e-6; }
function val(id){ var e=document.getElementById(id); return e?e.value:""; }
function fmt(v){ if(Math.abs(v-Math.round(v))<1e-9) return m(Math.round(v)); for(var d=2;d<=12;d++){ var n=v*d; if(Math.abs(n-Math.round(n))<1e-9) return (v<0?"−":"")+Math.abs(Math.round(n))+"/"+d; } return String(v); }

/* ---------- 効果音 ---------- */
var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC&&AC.state==="suspended") AC.resume(); return AC; }
function tone(f,t0,dur,type,vol){ var c=ac(); if(!c) return; var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0; o.type=type||"triangle"; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.16,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02); }
function sfx(n){ if(S&&S.mute) return;
  if(n==="ok"){ tone(659,0,0.12); tone(880,0.1,0.22); }
  else if(n==="soft"){ tone(294,0,0.18,"sine",0.07); }
  else if(n==="move"){ for(var i=0;i<3;i++) tone(392+i*98,i*0.08,0.09,"square",0.05); }
  else if(n==="dot"){ tone(988,0,0.07,"sine",0.08); }
  else if(n==="done"){ [523,659,784,659,1047].forEach(function(f,i){ tone(f,i*0.11,0.25,"triangle",0.15); }); }
}
function fb(ok){ sfx(ok?"ok":"soft"); }

/* ---------- 図の部品（方眼 20px） ---------- */
function svg(vb,inner,label,extra){ return '<svg viewBox="'+vb+'" role="img" aria-label="'+(label||'図')+'"'+(extra||'')+'>'+inner+'</svg>'; }
function grid(w,h,s){ s=s||20; var g=''; for(var x=0;x<=w;x+=s) g+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+h+'" stroke="var(--grid)" stroke-width="1"/>'; for(var y=0;y<=h;y+=s) g+='<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>'; return g; }
function T(x,y,s,o){ o=o||{}; return '<text x="'+x+'" y="'+y+'" font-size="'+(o.size||14)+'" text-anchor="'+(o.a||'middle')+'" fill="'+(o.c||'var(--ink)')+'"'+(o.w?' font-weight="700"':'')+'>'+s+'</text>'; }
function dot(x,y,c,r){ return '<circle cx="'+x+'" cy="'+y+'" r="'+(r||4)+'" fill="'+(c||'var(--ink)')+'"/>'; }
function ln(x1,y1,x2,y2,c,w,dash){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'var(--ink)')+'" stroke-width="'+(w||2)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+' stroke-linecap="round"/>'; }
function arrowHead(x,y,ang,c){ var a=ang*Math.PI/180, l=9, s=0.45; return '<polygon points="'+x+','+y+' '+(x-l*Math.cos(a-s))+','+(y-l*Math.sin(a-s))+' '+(x-l*Math.cos(a+s))+','+(y-l*Math.sin(a+s))+'" fill="'+(c||'var(--ink)')+'"/>'; }
function arcPath(cx,cy,r,a1,a2,c,w,dash){ var p1=[cx+r*Math.cos(a1*Math.PI/180),cy+r*Math.sin(a1*Math.PI/180)],p2=[cx+r*Math.cos(a2*Math.PI/180),cy+r*Math.sin(a2*Math.PI/180)]; var large=((a2-a1+360)%360)>180?1:0; return '<path d="M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+'" fill="none" stroke="'+(c||'var(--comp)')+'" stroke-width="'+(w||1.6)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>'; }

/* 直線・線分・半直線 */
function lineKind(k){
  var g=grid(320,100), ax=110, bx=210, y=50, c='var(--ink)';
  if(k==='line'){ g+=ln(20,y,300,y,c,2.5)+arrowHead(306,y,0,c)+arrowHead(14,y,180,c); }
  if(k==='seg'){ g+=ln(ax,y,bx,y,c,2.5); }
  if(k==='rayAB'){ g+=ln(ax,y,300,y,c,2.5)+arrowHead(306,y,0,c); }
  if(k==='rayBA'){ g+=ln(20,y,bx,y,c,2.5)+arrowHead(14,y,180,c); }
  g+=dot(ax,y)+dot(bx,y)+T(ax,y+24,'A')+T(bx,y+24,'B');
  return svg('0 0 320 100',g,'2点A、Bを通る線');
}
function angleFig(){ var g=grid(240,140); g+=ln(60,110,210,110)+ln(60,110,150,20)+dot(60,110)+dot(210,110)+dot(150,20)+T(48,128,'B')+T(214,130,'C')+T(160,18,'A')+arcPath(60,110,26,-45,0,'var(--gold)',3); return svg('0 0 240 140',g,'角ABC'); }
function distFig(){ var g=grid(240,140); g+=ln(10,110,230,110,'var(--ink)',2.5)+T(222,100,'ℓ')+dot(120,50)+T(132,46,'A')+ln(120,50,120,110,'var(--comp)',2,'5 4')+'<rect x="120" y="98" width="12" height="12" fill="none" stroke="var(--comp)" stroke-width="1.5"/>'; return svg('0 0 240 140',g,'点Aと直線ℓ'); }

function polyPts(pts,ox,oy,s){ s=s||20; return pts.map(function(p){ return (ox+p[0]*s)+','+(oy-p[1]*s); }).join(' '); }

/* ---------- 作図ステップ（垂直二等分線・角の二等分線・垂線） ---------- */
function constructSVG(kind){
  var g=grid(340,220), steps=[], bad='';
  if(kind==='pb'){
    var A=[110,120],B=[230,120],r=80,dx=60,dy=Math.sqrt(r*r-dx*dx);
    g+=ln(A[0],A[1],B[0],B[1])+dot(A[0],A[1])+dot(B[0],B[1])+T(A[0]-12,A[1]+20,'A')+T(B[0]+12,B[1]+20,'B');
    steps=[arcPath(A[0],A[1],r,-60,60),arcPath(B[0],B[1],r,120,240),dot(170,120-dy,'var(--red)',5)+dot(170,120+dy,'var(--red)',5),ln(170,20,170,215,'var(--red)',2.5)];
    bad=arcPath(A[0],A[1],40,-40,40,'var(--rasp)',2)+arcPath(B[0],B[1],40,140,220,'var(--rasp)',2)+T(170,200,'半径が小さいと交わらない',{size:13,c:'var(--rasp)'});
  }
  if(kind==='ab'){
    var O=[70,180],r1=90, e1=[310,180], e2=[70+240*Math.cos(-50*Math.PI/180),180+240*Math.sin(-50*Math.PI/180)];
    g+=ln(O[0],O[1],e1[0],e1[1])+ln(O[0],O[1],e2[0],e2[1])+dot(O[0],O[1])+T(O[0]-12,O[1]+18,'O')+T(e1[0]-10,e1[1]+18,'X')+T(70+190*Math.cos(-50*Math.PI/180)+14,180+190*Math.sin(-50*Math.PI/180),'Y');
    var P1=[O[0]+r1,O[1]],P2=[O[0]+r1*Math.cos(-50*Math.PI/180),O[1]+r1*Math.sin(-50*Math.PI/180)];
    var mid=[(P1[0]+P2[0])/2,(P1[1]+P2[1])/2], dd=Math.hypot(P1[0]-P2[0],P1[1]-P2[1])/2, r2=70, hh=Math.sqrt(r2*r2-dd*dd);
    var ux=(mid[0]-O[0])/Math.hypot(mid[0]-O[0],mid[1]-O[1]), uy=(mid[1]-O[1])/Math.hypot(mid[0]-O[0],mid[1]-O[1]);
    var Q=[mid[0]+ux*hh,mid[1]+uy*hh];
    steps=[arcPath(O[0],O[1],r1,-60,10)+dot(P1[0],P1[1],'var(--comp)',4)+dot(P2[0],P2[1],'var(--comp)',4),
           arcPath(P1[0],P1[1],r2,-110,-30)+arcPath(P2[0],P2[1],r2,-30,40),
           dot(Q[0],Q[1],'var(--red)',5),
           ln(O[0],O[1],O[0]+ux*250,O[1]+uy*250,'var(--red)',2.5)];
    bad=arcPath(P1[0],P1[1],45,-130,-60,'var(--rasp)',2)+arcPath(P2[0],P2[1],75,-40,40,'var(--rasp)',2)+T(255,215,'2つの弧の半径がちがう',{size:13,c:'var(--rasp)'});
  }
  if(kind==='perp'){
    var Pp=[170,40], ly=140, r3=125, hx=Math.sqrt(r3*r3-(ly-Pp[1])*(ly-Pp[1]));
    g+=ln(10,ly,330,ly)+T(322,ly-8,'ℓ')+dot(Pp[0],Pp[1])+T(Pp[0]+14,Pp[1]-4,'P');
    var X1=[Pp[0]-hx,ly],X2=[Pp[0]+hx,ly], r4=95, yy=ly+Math.sqrt(r4*r4-hx*hx);
    steps=[arcPath(Pp[0],Pp[1],r3,25,155)+dot(X1[0],X1[1],'var(--comp)',4)+dot(X2[0],X2[1],'var(--comp)',4),
           arcPath(X1[0],X1[1],r4,15,60)+arcPath(X2[0],X2[1],r4,120,165),
           dot(Pp[0],yy,'var(--red)',5),
           ln(Pp[0],Pp[1]-30,Pp[0],Math.min(yy+10,215),'var(--red)',2.5)];
    bad=ln(150,ly,150,40,'var(--rasp)',2,'6 4')+'<rect x="150" y="'+(ly-14)+'" width="14" height="14" fill="none" stroke="var(--rasp)" stroke-width="2"/>'+T(170,22,'三角定規の直角で引くのは作図ではない',{size:13,c:'var(--rasp)'});
  }
  return {base:g,steps:steps,bad:bad};
}

function locusBase(mode){
  var g=grid(340,240);
  if(mode==='pb') g+=dot(110,130)+dot(230,130)+T(98,152,'A')+T(242,152,'B');
  if(mode==='xy') return xyPlane();
  if(mode==='ab') g+=ln(60,200,330,200)+ln(60,200,60+300*Math.cos(-50*Math.PI/180),200+300*Math.sin(-50*Math.PI/180))+dot(60,200)+T(48,218,'O');
  return g;
}

/* ---------- テープ図（おうぎ形） ---------- */
function sectorTape(o){
  var x0=64,W=200,f=o.frac,g='',ys=[14,70],h=36;
  [[o.topName,o.topPart,o.topAll],[o.botName,o.botPart,o.botAll]].forEach(function(r,i){
    var y=ys[i];
    g+=T(x0-8,y+24,r[0],{a:'end',size:16});
    g+='<rect x="'+x0+'" y="'+y+'" width="'+W+'" height="'+h+'" fill="var(--stone2)" stroke="var(--line)" stroke-width="1.5"/>';
    g+='<rect x="'+x0+'" y="'+y+'" width="'+(W*f)+'" height="'+h+'" fill="var(--gold2)" stroke="var(--line)" stroke-width="1.5"/>';
    g+=T(x0+W*f/2,y+24,r[1],{size:15,c:/（/.test(r[1])?'var(--rasp)':'#1D2B3A'});
    g+=T(x0+W+8,y+24,r[2],{a:'start',size:16,c:/（/.test(r[2])?'var(--rasp)':'var(--ink)'});
  });
  g+=ln(x0+W*f,ys[0]+h,x0+W*f,ys[1],'var(--gold)',2,'4 3');
  return svg('0 0 340 116',g,'中心角と弧（または面積）の2本のテープ図');
}

function miniPie(frac){ var cx=44,cy=44,r=36,a2=-Math.PI/2+frac*2*Math.PI, g='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--stone2)" stroke="var(--line)" stroke-width="1.5"/>';
  g+= frac>=1 ? '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="var(--gold2)" stroke="var(--line)" stroke-width="1.5"/>' : '<path d="'+wedgePath(cx,cy,r,-Math.PI/2,a2)+'" fill="var(--gold2)" stroke="var(--line)" stroke-width="1.5"/>';
  return svg('0 0 88 88',g,'円の'+fmt(frac)+'のおうぎ形',' style="width:88px;flex:0 0 88px"'); }
function tapeWithPie(o){ return '<div class="row" style="flex-wrap:nowrap;gap:4px;align-items:center">'+miniPie(o.frac)+'<div style="flex:1;min-width:0">'+sectorTape(o)+'</div></div>'; }

/* ===== 追加：回答後のイメージ・ゲームとのつながり・傾きとのつながり ===== */
function DR(el,t0,t1){ /* 線を描くアニメーション（最後の形を基本値に） */
  return el.replace(/\/?>$/, ' pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="1;1;0" keyTimes="0;'+(t0/t1).toFixed(3)+';1" dur="'+t1+'s" fill="freeze"/></'+(el.indexOf('<path')===0?'path':(el.indexOf('<circle')===0?'circle':'line'))+'>');
}
function FD(inner,t0,t1){ return '<g opacity="1"><animate attributeName="opacity" values="0;0;1" keyTimes="0;'+(t0/t1).toFixed(3)+';1" dur="'+t1+'s" fill="freeze"/>'+inner+'</g>'; }
function rightMark(x,y,dx,dy,c){ return '<path d="M'+(x+dx*12)+' '+(y+dy*0)+' L'+(x+dx*12)+' '+(y-12)+' L'+x+' '+(y-12)+'" fill="none" stroke="'+(c||'var(--red)')+'" stroke-width="2"/>'; }

/* --- 2 図形の移動：ゲームのキャラ --- */
function hero(mode){ /* 自作キャラ（4×5マス、1マス10px）。左下が原点 */
  var R=[[0,4,3,1,'#C8323C'],[3,4,1,1,'#C8323C'],[0,3,3,1,'#F2C9A0'],[2,3,1,1,'#1D2B3A'],[0,1,3,2,'#2E6FB7'],[0,0,1,1,'#6B4423'],[2,0,1,1,'#6B4423']], g='';
  R.forEach(function(r){ g+='<rect x="'+(r[0]*10)+'" y="'+(-(r[1]+r[3])*10)+'" width="'+(r[2]*10)+'" height="'+(r[3]*10)+'" '+(mode==='ghost'?'fill="none" stroke="var(--good)" stroke-width="1.6" stroke-dasharray="3 2"':'fill="'+r[4]+'" stroke="#1D2B3A" stroke-width="1"')+'/>'; });
  return g;
}
moveSVG = function(it,c,animate){
  var W=340,H=220,g=grid(W,H), O=[170,110];
  if(it.kind==="t"){
    var s=it.start,go=it.goal, sx=s[0]*20, sy=H-s[1]*20, gx=go[0]*20, gy=H-go[1]*20;
    g+='<g transform="translate('+gx+' '+gy+')">'+hero('ghost')+'</g>'+T(gx+20,gy+16,'ゴール',{size:12,c:'var(--good)'});
    var dx=0,dy=0; if(animate){ dx=(+c.vals[0]||0)*20; dy=-(+c.vals[1]||0)*20; }
    g+='<g id="mvshape" style="transition:transform 1s ease;transform:translate('+dx+'px,'+dy+'px)"><g transform="translate('+sx+' '+sy+')">'+hero()+'</g>'+dot(sx,sy,'var(--gold)',5)+'</g>';
  }
  if(it.kind==="r"){
    var place='translate('+(O[0]+20)+' '+O[1]+')';
    g+='<g transform="rotate('+it.deg+' '+O[0]+' '+O[1]+')"><g transform="'+place+'">'+hero('ghost')+'</g></g>';
    var ang=0; if(animate && c.pick!=null){ ang = c.pick===0?90:(c.pick===1?-90:180); }
    g+='<g id="mvshape" style="transform-box:view-box;transform-origin:'+O[0]+'px '+O[1]+'px;transition:transform 1s ease;transform:rotate('+ang+'deg)"><g transform="'+place+'">'+hero()+'</g>'+ln(O[0],O[1],O[0]+20,O[1],'var(--gold)',2,'3 2')+'</g>';
    g+=dot(O[0],O[1],'var(--red)',5)+T(O[0]-12,O[1]+20,'O',{w:1});
  }
  if(it.kind==="s"){
    var X=170,Y=150, place2='translate(90 120)';
    g+=ln(X,5,X,215,'var(--comp)',2.5)+T(X+10,18,'ℓ',{c:'var(--comp)'})+ln(5,Y,335,Y,'var(--comp)',2.5)+T(325,Y-8,'m',{c:'var(--comp)'});
    g+='<g transform="translate('+(2*X)+' 0) scale(-1 1)"><g transform="'+place2+'">'+hero('ghost')+'</g></g>';
    var tf='none'; if(animate && c.pick!=null){ tf = c.pick===0 ? 'scale(-1,1)' : 'scale(1,-1)'; }
    var org = (animate && c.pick===1) ? '0px '+Y+'px' : X+'px 0px';
    g+='<g id="mvshape" style="transform-box:view-box;transform-origin:'+org+';transition:transform 1s ease;transform:'+tf+'"><g transform="'+place2+'">'+hero()+'</g></g>';
  }
  return svg('0 0 '+W+' '+H,g,'キャラを動かすパズル');
};

  g+='<g transform="translate(30 150)">'+hero()+'</g><g transform="translate(110 150)" opacity=".55">'+hero()+'</g>'+ln(66,128,104,128,'var(--red)',3)+arrowHead(110,128,0,'var(--red)')+T(85,84,'平行移動',{size:12,c:'var(--red)',w:1})+T(85,70,'x = x + 8',{size:11,c:'var(--sub)'});

  cdSnaps(sc,c).forEach(function(s){ g+='<circle cx="'+s.p[0].toFixed(1)+'" cy="'+s.p[1].toFixed(1)+'" r="'+(s.given?5:4.5)+'" fill="'+(s.given?'var(--ink)':'var(--gold)')+'" stroke="#1D2B3A" stroke-width="1"/>'; });

}

function asanohaFig(){ var g='', R=44; function hexAt(cx,cy){ var s='', P=[]; for(var i=0;i<6;i++){ var a=(60*i-30)*Math.PI/180; P.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]); }
  s+='<polygon points="'+P.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'" fill="#F3E3C3" stroke="#8A5A33" stroke-width="1.5"/>';
  for(var j=0;j<6;j++){ var p=P[j], q=P[(j+1)%6], m=[(p[0]+q[0])/2,(p[1]+q[1])/2], k=[(cx*1+p[0]+q[0])/3,(cy+p[1]+q[1])/3]; s+=ln(cx,cy,p[0],p[1],'#8A5A33',1.2)+ln(p[0],p[1],k[0],k[1],'#8A5A33',1.2)+ln(q[0],q[1],k[0],k[1],'#8A5A33',1.2)+ln(cx,cy,k[0],k[1],'#8A5A33',1.2); }
  return s; }
  var dx=R*Math.sqrt(3), cs=[[70,60],[70+dx,60],[70+2*dx,60],[70+dx/2,60+R*1.5],[70+dx*1.5,60+R*1.5],[70+dx*2.5,60+R*1.5]];
  cs.forEach(function(c){ g+=hexAt(c[0],c[1]); });
  return svg('0 0 340 190',g,'麻の葉の模様'); }
function honeyFig(){ var g=grid(300,170), R=30, dx=R*Math.sqrt(3); for(var r=0;r<3;r++) for(var c=0;c<5;c++){ var cx=40+c*dx+(r%2?dx/2:0), cy=40+r*R*1.5, P=[]; for(var i=0;i<6;i++){ var a=(60*i-30)*Math.PI/180; P.push((cx+R*Math.cos(a)).toFixed(1)+','+(cy+R*Math.sin(a)).toFixed(1)); } g+='<polygon points="'+P.join(' ')+'" fill="var(--gold2)" stroke="var(--line)" stroke-width="1.8"/>'; }
  return svg('0 0 300 170',g,'はちの巣のような正六角形のしきつめ'); }
function aedFig(){ var S=[[70,60],[250,50],[160,160]], col=['#F6C9C9','#C9DDF6','#CDEFD2'], g='', s=10;
  for(var x=0;x<320;x+=s) for(var y=0;y<200;y+=s){ var best=0,bd=1e9; S.forEach(function(p,i){ var d=Math.hypot(x+s/2-p[0],y+s/2-p[1]); if(d<bd){bd=d;best=i;} }); g+='<rect x="'+x+'" y="'+y+'" width="'+s+'" height="'+s+'" fill="'+col[best]+'"/>'; }
  ['P','Q','R'].forEach(function(n,i){ g+=dot(S[i][0],S[i][1],'var(--red)',6)+T(S[i][0]+10,S[i][1]-8,n+'（AED）',{a:'start',size:12,w:1}); });
  return svg('0 0 320 200',g,'3つのAEDのどれがいちばん近いかで色分けした地図'); }

function polyInCircle(n){ var g=grid(220,200), cx=110, cy=100, r=80, P=[]; for(var i=0;i<n;i++){ var a=2*Math.PI*i/n-Math.PI/2; P.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)); }

var WY={
 y1:{u:"u8",type:"card",html:'<b>寄り道：日本の伝統模様「麻の葉」</b>'+asanohaFig()+'<p>麻の葉の模様は、<b>合同な二等辺三角形</b>をすき間なく並べてできている。どの三角形も、平行移動・回転移動・対称移動のどれかで、となりの三角形に重ねられる。</p><p>着物や小物によく使われてきた模様。図形の移動を使うと、きれいな模様が「同じ形のくり返し」だとわかる。</p>'},
 y2:{u:"u8",type:"choice",q:"麻の葉の模様の中の、合同な三角形どうしを重ねるのに使える移動は？",fig:asanohaFig(),opts:["平行移動・回転移動・対称移動のどれも使える","平行移動だけ","どの移動でも重ならない"],c:0,ex:"向きが同じ三角形は平行移動、向きがちがう三角形は回転移動や対称移動で重なる。"},

 y4:{u:"u8",type:"card",html:'<b>寄り道：はちの巣はなぜ正六角形？</b>'+honeyFig()+'<p>平面をすき間なくしきつめられる正多角形は、<b>正三角形・正方形・正六角形</b>の3つだけ。そのうち、まわりの長さ（材料）が同じなら、<b>正六角形がいちばん広い</b>。</p><p>だから、はちの巣のような正六角形のしきつめ（ハニカム構造）は、少ない材料で広い部屋ができ、じょうぶでもある。飛行機のつばさの中などにも使われている。</p>'},
 y5:{u:"u8",type:"choice",q:"1種類の正多角形だけで、平面をすき間なくしきつめられるのは？",opts:["正三角形・正方形・正六角形","正三角形・正五角形・正六角形","正方形と正八角形だけ"],c:0,ex:"1つの角が 60°、90°、120° のとき、360° をちょうど分けられる。正五角形は 108° なので、すき間ができる。"},
 y6:{u:"u8",type:"card",html:'<b>寄り道：円周率 π の歴史</b>'+polyInCircle(6)+'<p>円周は直径の何倍か。昔の人は、円の<b>内側と外側に正多角形</b>をかいて、そのまわりの長さで円周をはさみうちにした。</p><div class="ex good"><span class="tag">アルキメデス</span>　紀元前3世紀、正96角形を使って、π は 3.1408… より大きく 3.1428… より小さいことを示した。</div><div class="ex good"><span class="tag">関孝和</span>　江戸時代の日本の数学者。正多角形の角の数をどんどん増やして、π を小数点以下10けた以上正しく求めた。</div><div class="ex good"><span class="tag">グレゴリー</span>　π/4 = 1 − 1/3 + 1/5 − 1/7 + … という式を見つけた。正多角形を使わずに計算できる。</div><p>今ではコンピューターで、何兆けたも計算されている。それでも終わりはない。</p>'},
 y7:{u:"u8",type:"choice",q:"半径 r の円の内側に、ぴったり正六角形をかいた。正六角形のまわりの長さは 6r（直径の3倍）。円周は直径の何倍より大きい？",fig:polyInCircle(6),opts:["3倍より大きい","3倍より小さい","ちょうど3倍"],c:0,ex:"円周は、内側の正六角形のまわりより長い。だから π は 3 より大きい。"},

 y9:{u:"u8",type:"card",html:'<b>寄り道：車いすの方向転換（教科書の活用の問題）</b>'+wheelFig()+'<p>車いすに乗った人が方向転換できるように、歩道の幅を決めている町がある。左の車輪を固定して回したり、2つの車輪の<b>まん中の点 P を中心に 180° 回転</b>したりして向きを変える。</p><p>P を中心に回すとき、車いすがはみ出さない範囲は、<b>P を中心として、P からもっとも遠い点 Q までを半径とする円</b>。中点 P は垂直二等分線で作図できる。</p>'},

 y12:{u:"u8",type:"card",html:'<b>寄り道：いちばん近い AED がわかる地図（教科書の活用の問題）</b>'+aedFig()+'<p>3つの地点 P、Q、R に AED がある。どこにいるときに、どの AED がいちばん近いかを地図に色分けしたい。</p><p>2つの地点 P、Q だけなら、<b>線分 PQ の垂直二等分線</b>が境目になる。線上の点は P と Q から等しい距離で、P 側の点は P の方が近い。</p><p>PQ、QR、RP の垂直二等分線を作図すると、地図は3つの地域に分かれる。</p>'},

  function voronoi(){ var g='',s=10; for(var x=0;x<340;x+=s) for(var y=0;y<240;y+=s){ var b=0,bd=1e9; AP.forEach(function(p,i){ var d=Math.hypot(x+5-p[0],y+5-p[1]); if(d<bd){bd=d;b=i;} }); g+='<rect x="'+x+'" y="'+y+'" width="'+s+'" height="'+s+'" fill="'+ACOL[b]+'" fill-opacity=".75"/>'; } return g; }
  function circum(){ var A=AP[0],B=AP[1],C=AP[2], d=2*(A[0]*(B[1]-C[1])+B[0]*(C[1]-A[1])+C[0]*(A[1]-B[1])), ux=((A[0]*A[0]+A[1]*A[1])*(B[1]-C[1])+(B[0]*B[0]+B[1]*B[1])*(C[1]-A[1])+(C[0]*C[0]+C[1]*C[1])*(A[1]-B[1]))/d, uy=((A[0]*A[0]+A[1]*A[1])*(C[0]-B[0])+(B[0]*B[0]+B[1]*B[1])*(A[0]-C[0])+(C[0]*C[0]+C[1]*C[1])*(B[0]-A[0]))/d; return [ux,uy]; }
  function bisLines(){ var O=circum(), g=''; [[0,1,2],[1,2,0],[2,0,1]].forEach(function(t){ var A=AP[t[0]],B=AP[t[1]],C=AP[t[2]], M=[(A[0]+B[0])/2,(A[1]+B[1])/2], d=[-(B[1]-A[1]),B[0]-A[0]], L=Math.hypot(d[0],d[1]); d=[d[0]/L,d[1]/L]; if(d[0]*(C[0]-M[0])+d[1]*(C[1]-M[1])>0) d=[-d[0],-d[1]]; g+=ln(O[0],O[1],O[0]+d[0]*400,O[1]+d[1]*400,'var(--ink)',2.5,'7 4'); }); return g+dot(O[0],O[1],'var(--ink)',4); }
  function nearest(p){ var b=0,bd=1e9; AP.forEach(function(q,i){ var d=Math.hypot(p[0]-q[0],p[1]-q[1]); if(d<bd){bd=d;b=i;} }); return b; }
  ITEMS.y12={u:"u8",type:"card",labNeed:true,html:'<b>体験：地図のどこにいたら、どの AED がいちばん近い？</b><p>地図の上を<b>クリック</b>すると、そこから3つの AED までの距離（だいたいの m）が出る。いろいろな場所で3回以上ためしたら、「境目を見る」を押そう。</p>'+labBox('aedlab',mapBase()+aedMarks())+btnRow([['show','境目を見る']])+LT,

    h+='<button type="button" class="btn main" data-fx="next">'+(D.pos+1<D.q.length||!c.res?'次へ':'このまとまりを終わる')+'</button>';
  }
  return h;
}
function numHint(it,v){
  if(v===null) return '';
  if(/π/.test(it.unit||"") && same(v,it.ans*3.14)) return 'π を 3.14 にしないで、π のまま残す。';
  return '';
}
function render(){ renderNav(); sndLabel(); app.innerHTML=(TRIAL&&!EMB?'<div style="border:3px solid #7A4FB7;background:#F1E9FB;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:15px"><b>保護者お試しモード</b>　答えた結果は記録されず、スプレッドシートにも送られません。このタブを閉じると消えます。</div>':'')+'<section class="stage">'+stageHTML()+'</section>'; bindLive(); save(); }

/* ---------- ドラッグとスライダー（再描画しない操作） ---------- */
function setAng(c,a){
  a=Math.max(30,Math.min(360,a)); var up=a>c.ang; if(a!==c.ang) sfx(a===360?"ok":"dot"); c.ang=a; save();
  var e; if((e=document.getElementById("sa"))) e.textContent=a; if((e=document.getElementById("sk"))) e.textContent=a/30;
  if((e=document.getElementById("sarc"))) e.textContent=piTxt(12*a/360); if((e=document.getElementById("sarea"))) e.textContent=piTxt(36*a/360);
  if((e=document.getElementById("pz"))) e.innerHTML=sectorSVG(a,{pop:up}); if((e=document.getElementById("tp"))) e.innerHTML=fracBars(a); if((e=document.getElementById("fcap"))) e.innerHTML=fracCap(a);
  if((e=document.getElementById("sl"))) e.value=a;
}
function bindLive(){
  var D=S.units[S.unit]; if(D.done||!D.cur) return; var it=ITEMS[D.q[D.pos].id], c=D.cur;
  if(it.bind){ try{ it.bind(document.querySelector('.stage')||document.body, c, function(){ if(c.labOK) return; c.labOK=true; save(); var b=document.querySelector('[data-fx="card"]'); if(b){ b.disabled=false; b.textContent='わかった、次へ'; } }); }catch(err){ console.error(err); } }
  if(it.type==="locus"){
    var sv=document.getElementById("locsvg"); if(!sv) return; var drag=false, last=c.pts.length?c.pts[c.pts.length-1]:null;
    function pt(ev){ var p=sv.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY; return p.matrixTransform(sv.getScreenCTM().inverse()); }
    function upd(x,y){
      c.p=[Math.max(6,Math.min(334,x)),Math.max(6,Math.min(234,y))];
      var d=locDist(it.mode,c.p), eq=Math.abs(d.a-d.b)<0.12 && d.a>0.3;
      var node=sv.querySelector("#lp"); node.setAttribute("cx",c.p[0]); node.setAttribute("cy",c.p[1]);
      document.getElementById("la").textContent=d.a.toFixed(1); document.getElementById("lb").textContent=d.b.toFixed(1);
      document.getElementById("leq").textContent=eq?"同じ！":"";
      if(eq && c.pts.length<20 && (!last || Math.hypot(c.p[0]-last[0],c.p[1]-last[1])>22)){ c.pts.push(c.p.slice()); last=c.p.slice(); sfx("dot"); save(); render(); return true; }
      return false;
    }
    sv.addEventListener("pointerdown",function(ev){ drag=true; try{ sv.setPointerCapture(ev.pointerId); }catch(e){} var q=pt(ev); upd(q.x,q.y); });
    sv.addEventListener("pointermove",function(ev){ if(!drag) return; var q=pt(ev); if(upd(q.x,q.y)) drag=false; });
    sv.addEventListener("pointerup",function(){ drag=false; save(); render(); });
  }
  if(it.type==="num" && it.live && c.res===null){ var inp=document.getElementById("fxin"); if(inp) inp.addEventListener("input",function(){ var v=parseNum(inp.value); var lf=liveFig(it,v,false); document.getElementById("livefig").innerHTML=lf.svg; document.getElementById("livecap").innerHTML=lf.cap; if(v!==null) sfx("dot"); }); }
  if(it.type==="circlearea"){ poseWedges(1,c); }
  if(it.type==="gdraw" && c.res===null){
    var gs=document.getElementById("gsvg"); if(gs) gs.addEventListener("pointerdown",function(ev){ var p=gs.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY; var q=p.matrixTransform(gs.getScreenCTM().inverse()); var gx=Math.round(q.x/20), gy=Math.round(q.y/20); if(c.gp.length<it.poly.length){ c.gp.push([gx,gy]); sfx("dot"); render(); } });
  }
  if(it.type==="cdraw" && c.res===null){
    var csv=document.getElementById("cdsvg"), sc=cdScene(it.scene), drag=null;
    function cp(ev){ var q=csv.createSVGPoint(); q.x=ev.clientX; q.y=ev.clientY; q=q.matrixTransform(csv.getScreenCTM().inverse()); return [q.x,q.y]; }
    function done(){ save(); if(cdGoal(sc,c)){ c.res=true; sfx("ok"); } else sfx("dot"); render(); }
    csv.addEventListener("pointerdown",function(ev){ var p=cp(ev), s=cdNear(sc,c,p);
      if(c.tool==="ruler"){ if(!s){ flash("点（●）をクリックしよう"); return; } if(!c.rp){ c.rp=s; render(); return; } if(Math.hypot(s[0]-c.rp[0],s[1]-c.rp[1])<3) return; c.objs.push({t:"l",a:c.rp,b:s}); c.rp=null; done(); return; }
      if(!s){ flash("コンパスの針は、点（●）の上に立てよう"); return; } drag={c:s}; try{ csv.setPointerCapture(ev.pointerId); }catch(e){} });
    csv.addEventListener("pointermove",function(ev){ if(!drag) return; var p=cp(ev), s=cdNear(sc,c,p,10), r=Math.hypot((s||p)[0]-drag.c[0],(s||p)[1]-drag.c[1]); drag.r=r; drag.snap=!!s;
      document.getElementById("cdprev").innerHTML='<circle cx="'+drag.c[0]+'" cy="'+drag.c[1]+'" r="'+r.toFixed(1)+'" fill="none" stroke="var(--comp)" stroke-width="2" stroke-dasharray="6 4"/>'+ln(drag.c[0],drag.c[1],(s||p)[0],(s||p)[1],'var(--comp)',1.5)+(s?'<circle cx="'+s[0]+'" cy="'+s[1]+'" r="9" fill="none" stroke="var(--comp)" stroke-width="2.5"/>':''); });
    csv.addEventListener("pointerup",function(){ if(!drag) return; var d=drag; drag=null; if(d.r>8){ c.lastR=d.r; c.objs.push({t:"c",c:d.c,r:d.r}); done(); } else if(c.lastR){ c.objs.push({t:"c",c:d.c,r:c.lastR}); done(); } else render(); });
  }
  if(it.type==="dragorder" && c.res===null){
    var list=document.getElementById("dlist"); if(list){
      var active=false, startY=0, idx=0;
      function cards(){ return list.querySelectorAll('.dcard'); }
      function paint(dy){ var cs=cards(); cs.forEach(function(cd,pos){ cd.querySelector('.dnum').textContent=pos+1; cd.lastChild.textContent=it.opts[c.seq[pos]]; cd.classList.toggle('drag',active&&pos===idx); cd.style.transform=(active&&pos===idx)?'translateY('+dy+'px)':''; }); }
      list.addEventListener('pointerdown',function(ev){ var cd=ev.target.closest('.dcard'); if(!cd) return; active=true; idx=+cd.dataset.pos; startY=ev.clientY; try{ list.setPointerCapture(ev.pointerId); }catch(e){} ev.preventDefault(); paint(0); });
      list.addEventListener('pointermove',function(ev){ if(!active) return; var dy=ev.clientY-startY, h2=cards()[idx].offsetHeight+8;
        if(dy>h2*0.6 && idx<c.seq.length-1){ var t=c.seq[idx]; c.seq[idx]=c.seq[idx+1]; c.seq[idx+1]=t; idx++; startY+=h2; dy-=h2; sfx("dot"); }
        else if(dy<-h2*0.6 && idx>0){ var t2=c.seq[idx]; c.seq[idx]=c.seq[idx-1]; c.seq[idx-1]=t2; idx--; startY-=h2; dy+=h2; sfx("dot"); }
        paint(dy); });
      function end(){ if(!active) return; active=false; save(); render(); }
      list.addEventListener('pointerup',end); list.addEventListener('pointercancel',end);
    }
  }
  if(it.type==="sector"){
    var sl=document.getElementById("sl"); if(sl) sl.addEventListener("input",function(){ setAng(c,+sl.value); });
  }
}

/* ---------- 操作 ---------- */
function next(D,c,it,e){
  if(D.first && !e.again) D.first[e.id]=!!c.res;
  if(it.type!=="card" && c.res!==null && c.res!==undefined){ var ul=(UNITS.filter(function(u){return u.key===it.u;})[0]||{}).label||""; mlLog({unit:"平面図形："+ul,pat:mlPat(it),id:e.id,q:mlStrip(it.q||it.ctx||"").slice(0,200),res:c.res?"○":"×",ans:mlAns(it),got:c.res?"":mlGot(it,c),ref:it.ref||"",memo:(EMB?"ステージ "+EMB_TITLE:"トレーニング")+(e.again?"（もう一度）":"")}); }
  if(!c.res && D.again.indexOf(D.pos)<0 && ["card","draw","locus","construct","sector","circlearea","roll","conceptanim"].indexOf(it.type)<0){ D.again.push(D.q.length); D.q.push({id:e.id,again:true}); }
  D.pos++; D.cur=null; if(D.pos>=D.q.length){ D.done=true; sfx("done"); }
}
document.addEventListener("click",function(ev){
  var t=ev.target.closest("button"); if(!t||t.disabled) return;
  if(t.id==="snd"){ S.mute=!S.mute; save(); sndLabel(); if(!S.mute) sfx("ok"); return; }
  if(t.dataset.unit){ S.unit=t.dataset.unit; render(); window.scrollTo(0,0); return; }
  var D=S.units[S.unit];
  if(t.dataset.fx==="redo"){ var f=freshUnits(); S.units[S.unit]=f[S.unit]; render(); return; }
  if(D.done){ if(t.dataset.fx==="zback"){ var miss=Object.keys(D.first).filter(function(k){return D.first[k]===false;}).map(function(k){ var x=ITEMS[k]; return {id:k,q:String(x.q||x.ctx||"").replace(/<[^>]+>/g,"").slice(0,40)}; }); parent.postMessage({type:"zdone",first:D.first,miss:miss},"*"); } return; }
  var e=D.q[D.pos], it=ITEMS[e.id], c=D.cur; if(!c) return;
  if(t.dataset.fxt!=null && c.res===null){ c.seq.push(it.tok[+t.dataset.fxt]); sfx("dot"); render(); return; }
  if(t.dataset.fxm!=null && c.res===null){ var mi=+t.dataset.fxm, mk=c.sel.indexOf(mi); if(mk>=0) c.sel.splice(mk,1); else c.sel.push(mi); render(); return; }
  if(t.dataset.fxc!=null && c.res===null){ c.pick=+t.dataset.fxc; c.res=c.pick===it.c; fb(c.res); render(); return; }
  if(t.dataset.fxv!=null && c.res===null){ c.pick=+t.dataset.fxv; c.res=c.pick===it.c; sfx("move"); render(); setTimeout(function(){ fb(c.res); },1000); return; }
  if(t.dataset.fxs!=null && c.res===null){ var ps=t.dataset.fxs.split(":"); c.cat[+ps[0]]=ps[1]; render(); return; }
  if(t.dataset.fxp!=null && c.res===null){ var pp=t.dataset.fxp.split(":"); c.sl[+pp[0]]=+pp[1]; render(); return; }
  if(t.dataset.fxo!=null && c.res===null){ c.seq.push(+t.dataset.fxo); render(); return; }
  if(t.dataset.fxk!=null){ var ki=+t.dataset.fxk, kk=c.chk.indexOf(ki); if(kk>=0) c.chk.splice(kk,1); else c.chk.push(ki); render(); return; }
  switch(t.dataset.fx){
    case "card": c.res=true; next(D,c,it,e); render(); window.scrollTo(0,0); return;
    case "tback": c.seq.pop(); render(); return;
    case "gundo": c.gp.pop(); render(); return;
    case "tcomp": c.tool="compass"; c.rp=null; render(); return;
    case "truler": c.tool="ruler"; c.rp=null; render(); return;
    case "cundo": c.objs.pop(); c.rp=null; render(); return;
    case "creset": c.objs=[]; c.rp=null; render(); return;
    case "cmodel": c.model=true; c.res=false; sfx("soft"); render(); return;
    case "oclear": c.seq=[]; render(); return;
    case "replay": render(); return;
    case "drawn": c.drawn=true; c.res=true; sfx("ok"); render(); return;
    case "cnext": if(c.step<4){ c.step++; sfx(c.step===4?"ok":"dot"); } render(); return;
    case "cbad": c.bad=!c.bad; render(); return;
    case "splus": setAng(c,c.ang+30); return;
    case "sminus": setAng(c,c.ang-30); return;
    case "dplus": case "dminus": c.d=Math.max(2,Math.min(10,c.d+(t.dataset.fx==="dplus"?2:-2))); c.open=false; sfx("dot"); render(); return;
    case "qplus": case "qminus": c.r=Math.max(1,Math.min(6,c.r+(t.dataset.fx==="qplus"?1:-1))); sfx("dot"); render(); return;
    case "gap": c.gap=!c.gap; render(); return;
    case "unroll":
      var box=document.getElementById("unroll"); sfx("move"); var t2=null;
      (function ur(ts){ if(t2===null) t2=ts; var k=Math.min(1,(ts-t2)/1600); if(box) box.innerHTML=unrollSVG(c.d,k); if(k<1) requestAnimationFrame(ur); else { c.open=true; if(c.seen.indexOf(c.d)<0) c.seen.push(c.d); save(); render(); sfx("ok"); } })(performance.now());
      return;
    case "canext": case "caback":
      var old=c.step, oldLay=CA_LAY[old]; c.step=Math.max(0,Math.min(5,c.step+(t.dataset.fx==="canext"?1:-1)));
      var newLay=CA_LAY[c.step], newN=CA_NN[c.step], nChange=newN!==c.N; c.N=newN; c.lay=newLay; save(); render();
      if(oldLay!==newLay || nChange){ var fromL = nChange ? 'row' : oldLay; poseWedges(0,c,fromL,newLay); sfx("move"); var t0=null; (function stepA(ts){ if(t0===null) t0=ts; var k=Math.min(1,(ts-t0)/1500); poseWedges(k,c,fromL,newLay); if(k<1) requestAnimationFrame(stepA); else sfx("ok"); })(performance.now()); }
      else sfx("dot");
      return;
    case "reveal": c.reveal=true; sfx("ok"); render(); return;
    case "next": next(D,c,it,e); render(); window.scrollTo(0,0); return;
    case "ok":
      if(it.type==="num"){ c.vals=[val("fxin")]; if(parseNum(c.vals[0])===null){ flash("数を入れよう"); return; } c.res=same(parseNum(c.vals[0]),it.ans); }
      else if(it.type==="move"){ c.vals=[val("mx"),val("my")]; var vx=parseNum(c.vals[0]), vy=parseNum(c.vals[1]); if(vx===null||vy===null){ flash("2つとも予想を入れよう"); return; } c.res = vx===it.goal[0]-it.start[0] && vy===it.goal[1]-it.start[1]; sfx("move"); render(); requestAnimationFrame(function(){ var g=document.getElementById("mvshape"); if(g){ g.style.transform='translate(0px,0px)'; requestAnimationFrame(function(){ g.style.transform='translate('+vx*20+'px,'+(-vy*20)+'px)'; }); } }); setTimeout(function(){ fb(c.res); },1000); return; }
      else if(it.type==="sort"){ if(!it.chips.every(function(x,i){return !!c.cat[i];})){ flash("全部えらんでから決定"); return; } c.res=it.cats.every(function(v,i){return c.cat[i]===v;}); }
      else if(it.type==="slots"){ if(!it.slots.every(function(x,i){return c.sl[i]!=null;})){ flash("全部えらんでから決定"); return; } c.res=it.ans.every(function(v,i){return c.sl[i]===v;}); }
      else if(it.type==="dragorder"){ c.res=c.seq.every(function(v,i){return v===i;}); }
      else if(it.type==="sym"){ if(!c.seq.length){ flash("記号を並べてから決定"); return; } var gs=c.seq.join(" "); c.res=it.ans.some(function(a){ return a.join(" ")===gs; }); }
      else if(it.type==="gdraw"){ var tg=gTarget(it); c.res=tg.every(function(p,i){ return c.gp[i]&&c.gp[i][0]===p[0]&&c.gp[i][1]===p[1]; }); }
      else if(it.type==="multi"){ if(!c.sel.length){ flash("選んでから決定"); return; } c.res=c.sel.slice().sort().join(",")===it.c.slice().sort().join(","); }
      else if(it.type==="order"){ if(c.seq.length<it.opts.length){ flash("全部ならべてから決定"); return; } c.res=c.seq.every(function(v,i){return v===i;}); }
      fb(c.res); render(); return;
  }
});
function flash(msg){ var s=app.querySelector(".stage"); var d=document.createElement("div"); d.className="msg hint"; d.textContent=msg; s.appendChild(d); setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },2200); }
document.addEventListener("keydown",function(ev){ if(ev.key!=="Enter"||!ev.target.matches||!ev.target.matches("input")) return; var b=document.querySelector('[data-fx=ok]'); if(b) b.click(); });
/* 回転・対称のパズル：押した直後に動かす */
var _render=render;
render=function(){ _render(); var D=S.units[S.unit]; if(D.done||!D.cur) return; var it=ITEMS[D.q[D.pos].id], c=D.cur; if(it.type==="move" && it.kind!=="t" && c.res!==null && !c.animated){ c.animated=true; var g=document.getElementById("mvshape"); if(g){ var final=g.style.transform; g.style.transform= it.kind==="r"?'rotate(0deg)':'none'; requestAnimationFrame(function(){ requestAnimationFrame(function(){ g.style.transform=final; }); }); } } };
render();
})();
