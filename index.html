<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平面図形 ステージ攻略</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{ --ink:#1D2B3A; --sub:#4E6274; --paper:#EAF1F6; --card:#FFFFFF; --gold:#F2B705; --gold2:#FFE07A; --good:#2F7D5B; --goodbg:#DDF1E7; --rasp:#B84A62; --hint:#FFF4CF; --comp:#2E6FB7; --red:#C8323C; --grid:#CFDDE8; color-scheme:light; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:#10202E; color:var(--ink); font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif; }
#wrap{ position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; margin:0 auto; top:50%; transform:translateY(-50%); }
canvas{ position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; display:block; }
.pix{ font-family:"DotGothic16",monospace; }
#hud{ position:absolute; left:0; right:0; top:0; display:flex; justify-content:space-between; align-items:center; padding:1.2% 2%; pointer-events:none; color:#fff; font-family:"DotGothic16",monospace; font-size:clamp(14px,2.2vw,26px); text-shadow:2px 2px 0 #1D2B3A; }
#hud .r{ display:flex; gap:18px; align-items:center; }
.overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(16,32,46,.55); }
.overlay[hidden]{ display:none; }
.panel{ width:min(94%,880px); max-height:92%; overflow:auto; background:var(--card); border:4px solid var(--ink); border-radius:10px; box-shadow:0 8px 0 var(--ink); padding:18px 22px; font-size:17px; line-height:1.6; }
.panel h2{ font-family:"DotGothic16",monospace; font-weight:400; font-size:26px; margin:0 0 6px; }
.panel .tag{ display:inline-block; background:var(--gold); border:2px solid var(--ink); border-radius:6px; padding:0 8px; font-size:14px; font-weight:700; }
.cols{ display:grid; grid-template-columns:1.1fr 1fr; gap:16px; align-items:start; }
@media (max-width:760px){ .cols{ grid-template-columns:1fr; } }
.fig{ border:2px solid var(--ink); border-radius:6px; background:#F6FAFD; }
.fig svg{ display:block; width:100%; height:auto; }
.btn{ font:inherit; font-weight:700; font-size:16px; padding:8px 14px; min-height:42px; border:2px solid var(--ink); border-bottom-width:5px; border-radius:6px; background:#fff; color:var(--ink); cursor:pointer; margin:4px 6px 4px 0; }
.btn:active{ transform:translateY(2px); border-bottom-width:3px; }
.btn.main{ background:#4F9A3E; color:#fff; } .btn.gold{ background:var(--gold); }
.btn:disabled{ opacity:.45; cursor:default; }
.btn.right{ background:var(--goodbg); border-color:var(--good); opacity:1; } .btn.wrong{ background:var(--hint); border-color:var(--rasp); opacity:1; }
.btn:focus-visible, input:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
input.num{ font:inherit; font-size:22px; width:5em; padding:4px 8px; border:2px solid var(--ink); border-radius:6px; }
.msg{ border:2px solid var(--ink); border-radius:6px; padding:8px 12px; margin:10px 0; }
.msg.ok{ background:var(--goodbg); } .msg.ng{ background:var(--hint); }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.hearts{ color:#ff5a6e; }
.startbox{ border:4px solid var(--ink); border-radius:10px; background:#FFF6D6; padding:12px 14px; margin:10px 0 12px; text-align:center; }
.btn.big{ font-size:22px; padding:12px 22px; min-height:56px; animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.04); } }
@media (prefers-reduced-motion:reduce){ .btn.big{ animation:none; } }
.trainbox{ margin-top:16px; padding:10px 12px; border:2px dashed #9AA6B2; border-radius:8px; color:#3B4A58; }
.stagegrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:10px; }
.world{ border:3px solid var(--ink); border-radius:8px; padding:10px; background:#F6FAFD; }
.world h3{ margin:0 0 6px; font-size:18px; }
.sbtn{ display:flex; justify-content:space-between; width:100%; text-align:left; }
.keys{ display:inline-block; border:2px solid var(--ink); border-bottom-width:4px; border-radius:5px; padding:0 7px; font-family:"DotGothic16",monospace; background:#fff; }
.panel.zpanel{ width:96%; height:94%; max-height:94%; display:flex; flex-direction:column; padding:10px 12px; overflow:hidden; }
.zhead{ flex:0 0 auto; padding:0 4px 6px; }
#zf{ flex:1; width:100%; border:2px solid var(--ink); border-radius:6px; background:#fff; }
code{ font-family:"DotGothic16",monospace; background:var(--paper); padding:1px 6px; border-radius:4px; }
.small{ font-size:14px; color:var(--sub); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="540" aria-label="横スクロールのステージ"></canvas>
  <div id="hud"><div id="hudL"></div><div class="r"><span id="hudCoin"></span><span id="hudHeart" class="hearts"></span><button id="bgm" class="btn" style="pointer-events:auto;font-size:13px;min-height:30px;padding:2px 8px;margin:0">BGM あり</button><button id="snd" class="btn" style="pointer-events:auto;font-size:13px;min-height:30px;padding:2px 8px;margin:0">音あり</button></div></div>
  <div id="ov" class="overlay" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
</div>
<script>
(function(){
"use strict";
/* ================= 基本 ================= */
var KEY="heimen-stage-v1";
var cv=document.getElementById("cv"), ctx=cv.getContext("2d"), W=960, H=540, TILE=30, GY=450;
var ov=document.getElementById("ov"), panel=document.getElementById("panel");
var SAVE; try{ SAVE=JSON.parse(localStorage.getItem(KEY)); }catch(e){ SAVE=null; }
if(!SAVE) SAVE={clear:{},stars:{},miss:[],mute:false};
if(SAVE.lives==null){ SAVE.lives=3; SAVE.pts=0; SAVE.nextUp=50; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(SAVE)); }catch(e){} }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function num(s){ s=String(s||"").trim().replace(/[−ー―－]/g,"-").replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);}).replace(/π/g,"").replace(/\s/g,""); if(!s) return null; if(s.indexOf("/")>=0){ var p=s.split("/"); var a=+p[0], b=+p[1]; return (isNaN(a)||isNaN(b)||!b)?null:a/b; } var v=Number(s); return isNaN(v)?null:v; }
function fmt(v){ if(Math.abs(v-Math.round(v))<1e-9) return String(Math.round(v)).replace("-","−"); return (Math.round(v*10)/10).toString(); }

/* ================= 効果音 ================= */
var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==="suspended") AC.resume(); return AC; }
function tone(f,t0,d,type,v){ var c=ac(); if(!c) return; var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0; o.type=type||"square"; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||0.08,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.02); }
function sfx(n){ if(SAVE.mute) return;
  if(n==="jump") { var c=ac(); if(!c) return; var o=c.createOscillator(),g=c.createGain(),t=c.currentTime; o.type="square"; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(700,t+0.12); g.gain.setValueAtTime(0.06,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.15); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.16); }
  if(n==="coin"){ tone(988,0,0.07); tone(1319,0.07,0.18); }
  if(n==="ok"){ tone(659,0,0.12,"triangle",0.15); tone(880,0.1,0.2,"triangle",0.15); tone(1175,0.22,0.25,"triangle",0.13); }
  if(n==="ng"){ tone(220,0,0.25,"sawtooth",0.06); }
  if(n==="bump"){ tone(160,0,0.08,"square",0.08); }
  if(n==="move"){ for(var i=0;i<4;i++) tone(392+i*98,i*0.08,0.09,"square",0.05); }
  if(n==="clear"){ [523,659,784,1047,784,1047].forEach(function(f,i){ tone(f,i*0.13,0.22,"square",0.07); }); }
  if(n==="hurt"){ tone(330,0,0.1,"square",0.08); tone(220,0.1,0.2,"square",0.08); }
}
/* ================= BGM（8トラック：メロディ・ハモり・和音・ベース・アルペジオ・キック・スネア・ハイハット） ================= */
var NOTE={C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11};
function nm(s){ var m=/^([A-G][#b]?)(\d)$/.exec(s); return m?12*(+m[2]+1)+NOTE[m[1]]:null; }
function chordTones(c){ var m=/^([A-G][#b]?)(m?)(maj7|7)?$/.exec(c), r=NOTE[m[1]]+48, t=[r, r+(m[2]?3:4), r+7]; if(m[3]==="7") t.push(r+(m[2]?10:10)); if(m[3]==="maj7") t.push(r+11); return t; }
function hz(n){ return 440*Math.pow(2,(n-69)/12); }
var SONGS={
 title:{bpm:118,beats:4,chords:"C G Am F C G F G",lead:"square",
  mel:"E5 - G5 - C6 - B5 A5 | G5 - D5 - G5 - - . | A5 - C6 - E6 - D6 C6 | A5 - F5 - A5 - - . | G5 E5 G5 C6 - B5 C6 D6 | B5 - G5 - D5 - G5 . | A5 G5 F5 A5 C6 - A5 . | B5 - D6 - G5 - - .",
  bass:"R . R 5 R . 5 .",arp:1,k:"x.......x.......",s:"....x.......x...",h:"..x...x...x...x."},
 w1:{bpm:132,beats:4,chords:"F C Dm Bb F C Bb C",lead:"square",
  mel:"A5 . C6 . A5 F5 G5 . | E5 . G5 . C6 - - . | F5 . A5 . D6 C6 A5 . | Bb5 - A5 - G5 - F5 . | A5 C6 F6 . E6 . C6 . | G5 . C6 . E6 - D6 . | D6 C6 Bb5 A5 G5 . Bb5 . | C6 - G5 - C6 - - .",
  bass:"R . 5 . 8 . 5 .",arp:4,k:"x...x...x...x...",s:"....x.......x...",h:"x.x.x.x.x.x.x.x."},
 w2:{bpm:108,beats:4,chords:"Em C G D Em C D D",lead:"triangle",
  mel:"B4 - E5 - G5 - F#5 E5 | E5 - - - G5 - - . | D5 - G5 - B5 - A5 G5 | F#5 - - - A5 - - . | B4 - E5 - G5 - B5 - | C6 - B5 A5 G5 - E5 . | F#5 - A5 - D6 - C6 A5 | F#5 - - - D5 - - .",
  bass:"R R . R 5 . R .",arp:2,k:"x.....x.x.......",s:"....x.......x..x",h:"x.xxx.xxx.xxx.xx"},
 w3:{bpm:150,beats:3,chords:"D Bm G A D Bm Em A",lead:"triangle",
  mel:"F#5 - A5 - D6 - | B5 - - - A5 . | G5 - B5 - D6 - | C#6 - - - A5 . | F#5 - A5 - F#6 - | D6 - B5 - F#5 - | G5 - E5 - G5 - | A5 - - - - .",
  bass:"R . 5 . 5 .",arp:3,k:"x...........",s:"....x...x...",h:"x.x.x.x.x.x."},
 under:{bpm:96,beats:4,chords:"Am Am F E Am Am Dm E",lead:"sine",bell:1,
  mel:"A5 . . C6 . . E6 . | D6 . C6 . B5 . . . | A5 . . C6 . . F6 . | E6 - - - G#5 . . . | A5 . . E5 . . A5 . | C6 . B5 . A5 . . . | D6 . F6 . E6 . D6 . | B5 - - - E5 . . .",
  bass:"R . . R . . 5 .",arp:4,k:"x.......x.......",s:"........x.......",h:"....x.......x..."},
 boss:{bpm:164,beats:4,chords:"Dm Bb C A Dm Bb Gm A",lead:"sawtooth",
  mel:"D5 D5 F5 D5 A5 - G5 F5 | F5 - D5 - Bb4 - - . | E5 E5 G5 E5 C6 - Bb5 A5 | A5 - C#5 - E5 - A5 . | D6 - C6 - A5 - F5 - | D5 F5 Bb5 - A5 - F5 . | G5 - Bb5 - D6 - C6 Bb5 | A5 - E5 - C#5 - A4 .",
  bass:"R R 8 R R 8 R 8",arp:1,k:"x...x...x...x...",s:"....x.......x.xx",h:"xxxxxxxxxxxxxxxx"},
 think:{bpm:80,beats:4,chords:"Cmaj7 Am7 Fmaj7 G7",lead:"sine",soft:1,
  mel:". . E5 - - - D5 - | C5 - - - . . . . | . . A4 - C5 - E5 - | D5 - - - . . . .",
  bass:"R - - - 5 - - -",arp:4,k:"",s:"",h:"........x......."}
};
SONGS.w1.parsed=null;
function parseSong(sg){ if(sg.p) return sg.p; var spb=sg.beats*4, ch=sg.chords.split(" ").map(chordTones), bars=sg.mel.split("|").map(function(b){ return b.trim().split(/\s+/); });
  var ev=[], mel=[];
  bars.forEach(function(tk,bi){ var cur=null; tk.forEach(function(t,i){ var st=bi*spb+i*2; if(t==="-"){ if(cur) cur.len+=2; return; } if(t==="."){ cur=null; return; } cur={st:st,n:nm(t),len:2,bar:bi}; mel.push(cur); }); });
  mel.forEach(function(m){ ev.push({tr:"lead",st:m.st,n:m.n,len:m.len}); if(m.st%4===0||m.len>=4){ var tones=ch[m.bar].map(function(x){return x+12;}).concat(ch[m.bar].map(function(x){return x+24;})), h=null; tones.forEach(function(x){ if(x<=m.n-3&&(!h||x>h)) h=x; }); if(h) ev.push({tr:"harm",st:m.st,n:h,len:m.len}); } });
  ch.forEach(function(c,bi){ var b0=bi*spb; ev.push({tr:"pad",st:b0,n:c,len:spb});
    sg.bass.split(" ").forEach(function(t,i){ if(t==="."||t==="-") return; var r=c[0]-12, n=t==="R"?r:t==="5"?r+7:t==="8"?r+12:r+4, len=2; var rest=sg.bass.split(" ").slice(i+1); for(var j=0;j<rest.length&&rest[j]==="-";j++) len+=2; ev.push({tr:"bass",st:b0+i*2,n:n,len:len}); });
    if(sg.arp){ var tones=c.concat([c[0]+12]), seq=sg.arp===2?[0,1,2,3,2,1]:sg.arp===3?[0,2,3,2,1,2]:sg.arp===4?[0,2,1,3]:[0,1,2,3]; for(var s2=0;s2<spb;s2++){ if(sg.arp===4&&s2%2) continue; ev.push({tr:"arp",st:b0+s2,n:tones[seq[s2%seq.length]%tones.length]+12,len:1}); } }
    ["k","s","h"].forEach(function(d){ var pt=sg[d]; if(!pt) return; for(var s3=0;s3<spb;s3++) if(pt[s3%pt.length]==="x") ev.push({tr:d,st:b0+s3}); });
  });
  sg.p={ev:ev,len:ch.length*spb}; return sg.p; }
var MUS={cur:null,gain:null,next:0,step:0,timer:null,duck:1};
function musicBus(){ var c=ac(); if(!c) return null; if(!MUS.gain){ MUS.gain=c.createGain(); MUS.gain.gain.value=0.9; var comp=c.createDynamicsCompressor(); MUS.gain.connect(comp); comp.connect(c.destination); var len=c.sampleRate*0.5, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0); for(var i=0;i<len;i++) d[i]=Math.random()*2-1; MUS.noise=b; } return c; }
function voice(c,ev,t,sg,spd){ var o,g=c.createGain(),dur=(ev.len||1)*spd, out=MUS.gain, v;
  if(ev.tr==="k"){ o=c.createOscillator(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.12); g.gain.setValueAtTime(0.32,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16); o.connect(g); g.connect(out); o.start(t); o.stop(t+0.18); return; }
  if(ev.tr==="s"||ev.tr==="h"){ var n=c.createBufferSource(); n.buffer=MUS.noise; var f=c.createBiquadFilter(); f.type=ev.tr==="s"?"bandpass":"highpass"; f.frequency.value=ev.tr==="s"?1800:7000; v=ev.tr==="s"?0.16:0.05; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+(ev.tr==="s"?0.12:0.04)); n.connect(f); f.connect(g); g.connect(out); n.start(t); n.stop(t+0.15); return; }
  if(ev.tr==="pad"){ ev.n.forEach(function(nn){ var oo=c.createOscillator(), gg=c.createGain(), lp=c.createBiquadFilter(); oo.type="sawtooth"; oo.frequency.value=hz(nn); lp.type="lowpass"; lp.frequency.value=900; gg.gain.setValueAtTime(0,t); gg.gain.linearRampToValueAtTime(sg.soft?0.03:0.018,t+0.15); gg.gain.setValueAtTime(sg.soft?0.03:0.018,t+dur-0.1); gg.gain.linearRampToValueAtTime(0,t+dur); oo.connect(lp); lp.connect(gg); gg.connect(out); oo.start(t); oo.stop(t+dur+0.05); }); return; }
  o=c.createOscillator();
  var cfg={lead:[sg.lead||"square",sg.lead==="sawtooth"?0.045:sg.lead==="sine"?0.11:0.06],harm:["triangle",0.05],bass:["triangle",0.16],arp:["square",sg.soft?0.018:0.022]}[ev.tr];
  o.type=cfg[0]; o.frequency.value=hz(ev.n); v=cfg[1];
  if(ev.tr==="lead"&&sg.bell){ var o2=c.createOscillator(), g2=c.createGain(); o2.type="sine"; o2.frequency.value=hz(ev.n)*3; g2.gain.setValueAtTime(0.04,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.5); o2.connect(g2); g2.connect(out); o2.start(t); o2.stop(t+0.6); }
  if(ev.tr==="lead"&&dur>0.3){ var lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=5.5; lg.gain.value=hz(ev.n)*0.008; lfo.connect(lg); lg.connect(o.frequency); lfo.start(t+0.15); lfo.stop(t+dur); }
  var rel=ev.tr==="arp"?0.08:Math.min(0.08,dur*0.3);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.01); g.gain.setValueAtTime(v*0.8,t+Math.max(0.02,dur-rel)); g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+0.02); }
function musicTick(){ var c=MUS.c; if(!c||!MUS.cur) return; var sg=SONGS[MUS.cur], p=parseSong(sg), spd=60/sg.bpm/4;
  while(MUS.next<c.currentTime+0.2){ var st=MUS.step%p.len; p.ev.forEach(function(e){ if(e.st===st) voice(c,e,MUS.next,sg,spd); }); MUS.next+=spd; MUS.step++; } }
function playMusic(name){ if(MUS.cur===name) return; var c=musicBus(); if(!c) return; MUS.c=c; MUS.cur=name; MUS.step=0; MUS.next=c.currentTime+0.08; if(!MUS.timer) MUS.timer=setInterval(musicTick,40); }
function musicVol(){ if(!MUS.gain||!MUS.c) return; var want=(SAVE.mute||SAVE.bgm===false)?0:0.9*MUS.duck; MUS.gain.gain.setTargetAtTime(want,MUS.c.currentTime,0.08); }
function musicWant(){ if(!G||!G.info||G.mode==="menu") return "title"; if(G.mode==="panel") return "think";
  if(G.under) return "under"; for(var i=0;i<G.gates.length;i++){ var g=G.gates[i]; if(g.type==="boss"&&g.enemy&&g.enemy.on&&!g.solved) return "boss"; }
  return G.info.w.key in SONGS ? G.info.w.key : "w1"; }
function musicUpdate(){ if(!AC||AC.state!=="running") return; playMusic(musicWant()); MUS.duck=(G&&G.mode==="panel")?0.55:1; musicVol(); }

var sndBtn=document.getElementById("snd"), bgmBtn=document.getElementById("bgm");
function sndLabel(){ sndBtn.textContent=SAVE.mute?"音なし":"音あり"; bgmBtn.textContent=SAVE.bgm===false?"BGM なし":"BGM あり"; }
sndBtn.onclick=function(){ SAVE.mute=!SAVE.mute; save(); sndLabel(); ac(); musicVol(); sndBtn.blur(); };
bgmBtn.onclick=function(){ SAVE.bgm=SAVE.bgm===false; save(); sndLabel(); ac(); musicVol(); bgmBtn.blur(); };
addEventListener("pointerdown",function(){ ac(); },{once:true}); addEventListener("keydown",function(){ ac(); },{once:true});
sndLabel();

/* ================= SVG 部品（問題パネル用） ================= */
function S(vb,inner,label){ return '<svg viewBox="'+vb+'" role="img" aria-label="'+(label||'図')+'">'+inner+'</svg>'; }

    if(g.type==="pp"){ var px=g.x+40, py=GY-220; ctx.fillStyle="#C8323C"; ctx.beginPath(); ctx.arc(px,py,7,0,7); ctx.fill(); ctx.fillStyle="#1D2B3A"; ctx.fillText("P",px+14,py-6); if(g.solved){ ctx.strokeStyle="#C8323C"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px,GY); ctx.stroke(); } }
  }

    if(g.type==="arc"){ ctx.strokeStyle=g.solved?"#F2B705":"rgba(29,43,58,.35)"; ctx.lineWidth=g.solved?8:3; ctx.setLineDash(g.solved?[]:[6,5]); ctx.beginPath(); ctx.arc(cx,cy-10,r,Math.PI,0); ctx.stroke(); ctx.setLineDash([]); if(g.solved&&!g.bridge) g.bridge={x:g.gap[0],y:GY,w:180,h:24,k:"bridge"}; if(g.solved) tile(g.gap[0],GY,180,24,"bridge"); }

      ctx.save(); ctx.translate(g.gap[0],GY); ctx.rotate(aa*Math.PI/180); ctx.fillStyle="#FFE07A"; ctx.strokeStyle="#1D2B3A"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,180,-Math.PI/9,0); ctx.closePath(); ctx.fill(); ctx.stroke(); tile(0,0,180,24,"bridge"); ctx.restore(); }

    var col=g.spec.paper?"#8A5A33":"#2E6FB7", lab=g.spec.paper?"紙":"問";

    ctx.fillStyle="#7F8B96"; ctx.fillRect(dd.x-60,dd.y-40,200,40); for(var c3=0;c3<5;c3++) ctx.fillRect(dd.x-60+c3*44,dd.y-64,26,24);
  }
}

var current=null;
function openPanel(html){ G.mode="panel"; panel.innerHTML=html; ov.hidden=false; keys={}; var f=panel.querySelector("input,button.btn:not([data-close])"); if(f) setTimeout(function(){ f.focus(); },30); }

function gateTitle(g){ if(g.type==="door"||g.type==="boss") return g.spec.k==="sign"?"看板":(g.spec.boss?"城の門":(g.spec.paper?"紙ミッション":"問題の扉")); if(false) return ({choice:"問題の扉",multi:"問題の扉",sym:"記号の扉",num:"計算の扉",paper:"紙ミッション"})[g.spec.k]; return {translate:"平行移動のゲート",rotate:"回転移動のはね橋",reflect:"対称移動の鏡",pb:"垂直二等分線の塔",ab:"角の二等分線の光",pp:"垂線のロープ",arc:"弧のレール",fan:"おうぎの扉",area:"おうぎ形の床",boss:"城の門"}[g.type]; }
function heartsTxt(){ var s=""; for(var i=0;i<5;i++) s+= i<G.hearts?"♥":"♡"; return s; }

  }

function choiceBtns(opts,act){ var ord=shuffle(opts.map(function(o,i){return i;})); return '<div>'+ord.map(function(i){ return '<button class="btn" data-act="'+act+'" data-i="'+i+'">'+opts[i]+'</button>'; }).join('')+'</div>'; }
function transFig(g){
  var cw=24, cols=14, rows=8, gx=10, gy=5, s=gridSVG(cols*cw,rows*cw,cw);
  s+='<rect x="'+(gx*cw)+'" y="'+(gy*cw)+'" width="'+(3*cw)+'" height="'+(rows-gy)*cw+'" fill="#CDEBFA"/>'; // gap (空)
  s+='<rect x="0" y="'+(gy*cw)+'" width="'+(gx*cw)+'" height="'+(rows-gy)*cw+'" fill="#8A5A33" opacity=".5"/><rect x="'+((gx+3)*cw)+'" y="'+(gy*cw)+'" width="'+cw+'" height="'+(rows-gy)*cw+'" fill="#8A5A33" opacity=".5"/>';
  s+=bridgeSVG(gx*cw,gy*cw,3*cw,cw*0.8,true)+tx((gx+1.5)*cw,gy*cw-6,'ここ',{size:12,c:'#2F7D5B',w:1});
  var px=(gx-g.dx)*cw, py=(gy-g.dy)*cw; s+=bridgeSVG(px,py,3*cw,cw*0.8,false)+dt(px,py,'#C8323C',5)+dt(gx*cw,gy*cw,'#2F7D5B',4);
  return S('0 0 '+(cols*cw)+' '+(rows*cw),s,'橋ブロックと置く場所');
}
function rotFig(v){
  var s=gridSVG(320,200), gx0=100, gx1=220, gy=130, L=120;
  s+='<rect x="0" y="'+gy+'" width="'+gx0+'" height="70" fill="#8A5A33" opacity=".5"/><rect x="'+gx1+'" y="'+gy+'" width="100" height="70" fill="#8A5A33" opacity=".5"/>';
  s+=bridgeSVG(gx0,gy,L,14,true);
  var O = v==="R"? [gx1,gy] : [gx0,gy], body;
  if(v==="L") body='<rect x="'+(gx0)+'" y="'+(gy-L)+'" width="14" height="'+L+'" fill="#A97446" stroke="#1D2B3A" stroke-width="2"/>';
  if(v==="R") body='<rect x="'+(gx1-14)+'" y="'+(gy-L)+'" width="14" height="'+L+'" fill="#A97446" stroke="#1D2B3A" stroke-width="2"/>';
  if(v==="F") body='<rect x="'+(gx0-L)+'" y="'+gy+'" width="'+L+'" height="14" fill="#A97446" stroke="#1D2B3A" stroke-width="2"/>';
  return S('0 0 320 200',s+body+dt(O[0],O[1],'#C8323C',6)+tx(O[0]+(v==="R"?14:-14),O[1]+22,'O',{w:1}),'はね橋');
}
function refFig(){
  var s=gridSVG(320,200), base=170, X=160;
  for(var i=0;i<4;i++) s+='<rect x="'+(40+i*20)+'" y="'+(base-(i+1)*20)+'" width="20" height="'+(i+1)*20+'" fill="#A3AEB8" stroke="#1D2B3A"/>';
  s+='<rect x="120" y="'+(base-100)+'" width="80" height="100" fill="#7F8B96" stroke="#1D2B3A"/>';
  for(i=0;i<4;i++) s+='<rect x="'+(2*X-(40+i*20)-20)+'" y="'+(base-(i+1)*20)+'" width="20" height="'+(i+1)*20+'" fill="none" stroke="#2F7D5B" stroke-dasharray="4 3"/>';
  s+=ln(X,10,X,195,'#2E6FB7',2.5,'6 4')+tx(X+10,22,'ℓ',{a:'start',c:'#2E6FB7'})+ln(5,base-100,315,base-100,'#2E6FB7',2,'6 4')+tx(308,base-106,'m',{c:'#2E6FB7'})+dt(X,base-100,'#C8323C',5)+tx(X+12,base-108,'O',{a:'start'});

function pbFig(P){

function abFig(on){ var s=gridSVG(320,200), O=[40,180]; s+=ln(O[0],O[1],310,O[1],'#1D2B3A',3)+ln(O[0],O[1],O[0]+200,O[1]-200,'#1D2B3A',3)+dt(O[0],O[1])+tx(O[0]-6,O[1]+16,'O');
  if(on){ var a=-22.5*Math.PI/180; s+=ln(O[0],O[1],O[0]+300*Math.cos(a),O[1]+300*Math.sin(a),'#F2B705',5); }

function ppFig(on){ var s=gridSVG(320,200); s+=ln(10,170,310,170,'#1D2B3A',3)+tx(300,160,'ℓ')+dt(160,40,'#C8323C',6)+tx(172,36,'P',{a:'start'})+ln(160,40,240,170,'#B84A62',1.5,'5 4')+ln(160,40,90,170,'#B84A62',1.5,'5 4');

function secFig(p,type){
  var s=gridSVG(320,200), cx=110, cy=110, r=80, a=p.a;
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#A9C0D2" stroke-width="2" stroke-dasharray="5 4"/>';

  if(type==="fan") s+=tx(250,165,'弧 '+fmt(p.arc)+'π',{size:14,c:'#9A7300',w:1});
  return S('0 0 320 200',s,'おうぎ形');
}
function bossFig(k){ if(k!=="boss1") return ''; var s=gridSVG(320,190), C=[160,160];
  s+='<polygon points="'+C[0]+','+C[1]+' 60,90 140,40" fill="#FFE07A" stroke="#1D2B3A" stroke-width="2"/>'+'<g transform="rotate(35 '+C[0]+' '+C[1]+')"><polygon points="'+C[0]+','+C[1]+' 60,90 140,40" fill="none" stroke="#2E6FB7" stroke-width="2.5" stroke-dasharray="5 4"/></g>';
  s+=tx(52,92,'B',{a:'end'})+tx(140,34,'A')+tx(C[0],C[1]+18,'C')+tx(230,60,'△PQC',{c:'#2E6FB7'})+tx(160,184,'C を中心に時計回り 35°',{size:12,c:'#4E6274'});
  return S('0 0 320 190',s,'回転移動の図'); }

panel.addEventListener("click",function(e){

/* ===== 記録をGoogleスプレッドシートへ送る（おうちの人が送り先を設定したときだけ） ===== */
var ML={cfg:"math-log-cfg",q:"math-log-queue",snap:"math-log-snap",weak:"math-log-weak"};
function mlCfg(){ try{ return JSON.parse(localStorage.getItem(ML.cfg))||{}; }catch(e){ return {}; } }
function mlSetCfg(c){ try{ localStorage.setItem(ML.cfg,JSON.stringify(c)); }catch(e){} }
function mlQ(){ try{ return JSON.parse(localStorage.getItem(ML.q))||[]; }catch(e){ return []; } }
function mlStrip(h){ return String(h==null?"":h).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim(); }
function mlLog(row){ row.t=new Date().toISOString(); row.app=row.app||"平面図形 ステージ攻略"; var q=mlQ(); q.push(row); if(q.length>800) q=q.slice(-800); try{ localStorage.setItem(ML.q,JSON.stringify(q)); }catch(e){} mlFlush(); }
var mlBusy=false;
function mlPost(c,body,cors){ return fetch(c.url,{method:"POST",mode:cors?"cors":"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}); }
function mlFlush(){ var c=mlCfg(); if(!c.url||!c.key||mlBusy) return; var q=mlQ(); if(!q.length) return; var batch=q.slice(0,40); mlBusy=true;
  mlPost(c,{key:c.key,rows:batch}).then(function(){ var q2=mlQ(); q2.splice(0,batch.length); try{ localStorage.setItem(ML.q,JSON.stringify(q2)); }catch(e){} mlBusy=false; c=mlCfg(); c.sent=(c.sent||0)+batch.length; c.last=new Date().toISOString(); mlSetCfg(c); if(q2.length) mlFlush(); }).catch(function(){ mlBusy=false; }); }
function mlSnapshot(force){ var c=mlCfg(); if(!c.url||!c.key) return Promise.resolve(-1); if(!force && localStorage.getItem(ML.snap)) return Promise.resolve(0);
  if(!c.dev){ c.dev=(/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)?"スマホ":"パソコン")+"-"+Math.random().toString(36).slice(2,6); mlSetCfg(c); }
  var skip=/^(math-log-|heimen-zukei-embed)/, items=[];
  for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(!k||skip.test(k)) continue; var v=localStorage.getItem(k)||""; var n=Math.max(1,Math.ceil(v.length/40000)); for(var p=0;p<n;p++) items.push({dev:c.dev,origin:location.origin,k:k,part:p+1,total:n,data:v.slice(p*40000,(p+1)*40000)}); }
  var chain=Promise.resolve();
  for(var j=0;j<items.length;j+=3){ (function(g){ chain=chain.then(function(){ return mlPost(c,{key:c.key,snapshot:g}); }); })(items.slice(j,j+3)); }
  return chain.then(function(){ try{ localStorage.setItem(ML.snap,new Date().toISOString()); }catch(e){} return items.length; });
}
function mlWeakCache(){ try{ return JSON.parse(localStorage.getItem(ML.weak))||null; }catch(e){ return null; } }
function mlWeakFetch(){ var c=mlCfg(); if(!c.url||!c.key) return Promise.resolve(null);
  return mlPost(c,{key:c.key,want:"weak"},true).then(function(r){ return r.json(); }).then(function(d){ if(d&&d.ok&&d.weak){ try{ localStorage.setItem(ML.weak,JSON.stringify({at:Date.now(),weak:d.weak})); }catch(e){} return d.weak; } return null; }).catch(function(){ return null; }); }

  h+='<details style="margin-top:12px"><summary>記録の送り先（おうちの人用）'+(mc.url?'　<span class="small">設定ずみ</span>':'')+'</summary><p class="small">問題の結果（○・×）を、Google スプレッドシート「拓真 数学まちがい記録」に送る。名前は送らない。設定はこの端末だけに保存される。</p>'+
    '<p><label class="small">ウェブアプリのURL<br><input id="mlurl" style="width:100%;font-size:14px" value="'+(mc.url||'').replace(/"/g,'')+'" placeholder="https://script.google.com/macros/s/……/exec"></label></p>'+
    '<p><label class="small">合言葉<br><input id="mlkey" style="width:14em;font-size:14px" value="'+(mc.key||'').replace(/"/g,'')+'"></label> <button class="btn" id="mlsave" style="font-size:14px;min-height:32px;padding:4px 10px">保存して送る</button></p>'+
    '<p class="small" id="mlstat">まだ送っていない記録：'+mq+' 件'+(mc.last?'　最後に送った日時：'+new Date(mc.last).toLocaleString('ja-JP'):'')+'<br>ほかのアプリの記録（この端末に残っている分）：'+(localStorage.getItem(ML.snap)?'送信ずみ（'+new Date(localStorage.getItem(ML.snap)).toLocaleDateString('ja-JP')+'）':'まだ')+'</p>'+
    '<button class="btn" id="mlsnap" style="font-size:13px;min-height:30px;padding:2px 8px">ほかのアプリの記録をもう一度送る</button></details>';
  var wn=WORK&&WORK.items?Object.keys(WORK.items).length:0;
  h+='<details style="margin-top:12px"><summary>ワーク版ファイル（おうちの人用）</summary><p class="small">ワークの問題そのものは、公開しないファイルに入っている。このパソコンで1回読みこむと、ステージとトレーニングにワークの問題が出るようになる。</p><p>'+(wn?'<b>読みこみ済み：'+wn+' 問</b>　<button class="btn" id="wkoff">外す</button>':'まだ読みこんでいない')+'</p><input type="file" id="wkfile" accept=".json,application/json"></details>';
  if(SAVE.miss.length) h+='<details style="margin-top:12px"><summary>まちがえた問題の記録（'+SAVE.miss.length+'）</summary><ul class="small">'+SAVE.miss.slice(-15).reverse().map(function(m){return '<li>'+m.at+'　'+m.stage+'　'+m.what+'</li>';}).join('')+'</ul></details>';
  panel.innerHTML=h; ov.hidden=false;
  panel.querySelectorAll("[data-stage]").forEach(function(b){ b.onclick=function(){ ac(); startStage(b.dataset.stage); }; });
  var wf=document.getElementById("wkfile"); if(wf) wf.onchange=function(){ var f=wf.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ try{ var o=JSON.parse(r.result); if(!o.items) throw 0; localStorage.setItem("heimen-work-v1",r.result); WORK=o; showTitle(); }catch(e){ alert("ワーク版ファイルではないようです"); } }; r.readAsText(f); };
  var ms=document.getElementById("mlsave"); if(ms) ms.onclick=function(){ var u=document.getElementById("mlurl").value.trim(), k=document.getElementById("mlkey").value.trim(); if(u && !/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(u)){ alert("URL は https://script.google.com/macros/s/……/exec の形で入れてください"); return; } var c=mlCfg(); c.url=u; c.key=k; mlSetCfg(c); mlFlush(); document.getElementById("mlstat").textContent="送っています…"; mlSnapshot(false).then(function(n){ return mlWeakFetch().then(function(w){ document.getElementById("mlstat").textContent="保存しました。"+(n>0?"ほかのアプリの記録 "+n+" 件を送りました。":"")+(w?"スプレッドシートとつながりました（苦手 "+w.length+" 問）。":"スプレッドシートの返事が読めませんでした。URL と合言葉を確かめてください。"); }); }); };
  var mn=document.getElementById("mlsnap"); if(mn) mn.onclick=function(){ document.getElementById("mlstat").textContent="送っています…"; mlSnapshot(true).then(function(n){ document.getElementById("mlstat").textContent=n<0?"先に URL と合言葉を保存してください。":"ほかのアプリの記録 "+n+" 件を送りました。"; }); };
  var wo=document.getElementById("wkoff"); if(wo) wo.onclick=function(){ localStorage.removeItem("heimen-work-v1"); WORK=null; showTitle(); };
}
function prevId(wi,si){ if(si>0) return WORLDS[wi].stages[si-1].id; if(wi>0){ var pw=WORLDS[wi-1]; return pw.stages[pw.stages.length-1].id; } return null; }
function startStage(id){ build(id); ov.hidden=true; panel.innerHTML=""; G.mode="play"; }
function stageClear(){
  if(G.mode!=="play") return; G.mode="clear"; sfx("clear");
  var star = G.missed===0?3:(G.missed<=2?2:1); SAVE.clear[G.id]=true; SAVE.stars[G.id]=Math.max(SAVE.stars[G.id]||0,star); save();
  var h='<h2>ステージクリア！</h2><p style="font-size:30px">'+'★'.repeat(star)+'☆'.repeat(3-star)+'</p><p>まちがい：'+G.missed+' 回　コイン：'+G.coin+'</p><p class="small">★3つ＝まちがい0　★2つ＝まちがい2回まで</p><p><b>紙でやろう：</b>ワークの同じところを、ノートに図をかいて解こう。</p><button class="btn main" id="toMenu">ステージえらびへ</button>';
  panel.innerHTML=h; ov.hidden=false; document.getElementById("toMenu").onclick=showTitle;
}
function showOver(msg){
  SAVE.lives--; save();
  if(SAVE.lives>0){ var h0='<h2>ハートがなくなった</h2><p>'+(msg||'')+'</p><p style="font-size:22px">のこり <b>'+SAVE.lives+' 機</b></p><p>コインと正解でポイントがたまると、機が増える（50ポイントごとに1機）。</p><button class="btn main" id="again">このステージをもう一度</button><button class="btn" id="toMenu">ステージえらびへ</button>'; panel.innerHTML=h0; ov.hidden=false; document.getElementById("again").onclick=function(){ startStage(G.main?G.main.id:G.id); }; document.getElementById("toMenu").onclick=showTitle; return; }
  SAVE.lives=3; save();
  var h='<h2>ゲームオーバー</h2><p>'+(msg||'')+' ハートがなくなった。</p><p>まちがえた問題は、もう一度出るときに数が変わる。図をよく見て考えよう。</p><button class="btn main" id="again">もう一度</button><button class="btn" id="toMenu">ステージえらびへ</button>';
  panel.innerHTML=h; ov.hidden=false; document.getElementById("again").onclick=function(){ startStage(G.id); }; document.getElementById("toMenu").onclick=showTitle;
}
function openPause(){ G.mode="pause"; var h='<h2>メニュー</h2><button class="btn main" id="resume">つづける</button><button class="btn" id="again">最初からやり直す</button><button class="btn" id="toMenu">ステージえらびへ</button>'; panel.innerHTML=h; ov.hidden=false;
  document.getElementById("resume").onclick=function(){ ov.hidden=true; G.mode="play"; }; document.getElementById("again").onclick=function(){ startStage(G.id); }; document.getElementById("toMenu").onclick=showTitle; }
// パネルを閉じたとき、ハート0ならゲームオーバー
var _close=closePanel; closePanel=function(){ _close(); if(G.pendingOver){ G.pendingOver=false; G.mode="over"; showOver(""); } };

/* ================= ループ ================= */
function hud(){ var L=document.getElementById("hudL"), C=document.getElementById("hudCoin"), Hh=document.getElementById("hudHeart");
  if(!G||!G.info){ L.textContent=""; C.textContent=""; Hh.textContent=""; return; }
  L.textContent=(G.under?"":G.id+" ")+G.info.s.name; C.textContent="機×"+SAVE.lives+"　● "+G.coin+"　★"+SAVE.pts; Hh.textContent=heartsTxt(); }
var last=0, acc=0;
function loop(ts){ requestAnimationFrame(loop); musicUpdate(); if(!G||!G.info){ hud(); drawMenuBg(); return; } var d=Math.min(50,ts-last); last=ts; acc+=d; while(acc>=16.67){ if(G.mode==="play"||G.mode==="panel") { G.t++; } if(G.mode==="play") step(); acc-=16.67; } draw(); hud(); }
function drawMenuBg(){ var gr=ctx.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#7EC8F2"); gr.addColorStop(1,"#CDEBFA"); ctx.fillStyle=gr; ctx.fillRect(0,0,W,H); for(var i=0;i<W;i+=TILE){ tile(i,GY,TILE,90,"ground"); } drawHero(120,GY-36,1,1); }
mlFlush(); mlSnapshot(false); mlWeakFetch().then(function(w){ if(w && G && G.mode==="menu" && !document.activeElement.matches("input")) showTitle(); }); showTitle(); requestAnimationFrame(loop);
window.__game={get MUS(){return MUS;},get G(){return G;}, openGate:function(i){ openGate(G.gates[i]); }, start:startStage};
})();
</script>
